# Tools a human needs to bootstrap this repo, plus kubectl for the e2e tests.
# Everything else the build depends on (controller-gen, setup-envtest,
# golangci-lint, kind) is installed into bin/ by the Makefile. The e2e pipeline
# step installs mise so kubectl is on PATH; other CI steps need only Go and
# Docker.
[tools]
go = "1.26.5"
kubebuilder = "4.15.0"
kubectl = "1.34.0"
