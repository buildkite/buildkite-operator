# Supervisor loop for the dind-runner Deployment, mounted into the supervisor
# container at /scripts/supervisor.sh. Kept out of deployment.yaml so the shell
# is editable and lintable on its own, rather than embedded as a heredoc.
#
# Editing this ConfigMap changes the mounted script but does not by itself
# restart running Pods. Apply with examples/dind-runner/apply.sh, which stamps a
# hash of this file onto the Deployment's Pod template so a changed script rolls
# the Deployment automatically. If you instead apply by hand with
# `kubectl apply -f`, roll it yourself afterward:
#
#   kubectl rollout restart deployment/dind-runner
#
# Apply this before (or alongside) deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dind-runner-supervisor
  labels:
    app.kubernetes.io/name: buildkite-agent
    app.kubernetes.io/instance: dind-runner
data:
  supervisor.sh: |
    #!/bin/sh
    set -u

    agent_name="buildkite-agent"
    stopping=0
    log_pid=""
    prefetched=0
    # Master switch for between-job cleanup, independent of SINGLE_USE.
    # When "false" the supervisor leaves containers, networks, volumes
    # and /workspace in place so a finished job's state can be inspected.
    cleanup="${CLEANUP:-true}"

    # All supervisor-originated lines carry this prefix so they are
    # distinguishable from the inner agent's output in `kubectl logs`.
    log() { printf 'supervisor: %s\n' "$*"; }

    stop_log_follower() {
    	if [ -n "$log_pid" ]; then
    		kill "$log_pid" >/dev/null 2>&1 || true
    		wait "$log_pid" >/dev/null 2>&1 || true
    		log_pid=""
    	fi
    }

    cleanup_containers() {
    	container_ids=$(docker ps --all --quiet 2>/dev/null) || return 1
    	if [ -n "$container_ids" ]; then
    		count=$(printf '%s\n' "$container_ids" | wc -l | tr -d ' ')
    	else
    		count=0
    	fi
    	log "removing $count container(s)"
    	if [ -n "$container_ids" ]; then
    		# --volumes removes each container's anonymous volumes with it,
    		# so they do not accumulate in the daemon's /var/lib/docker.
    		docker rm --force --volumes $container_ids >/dev/null 2>&1 || return 1
    	fi
    }

    prune_networks() {
    	out=$(docker network prune --force 2>/dev/null) || true
    	count=$(printf '%s\n' "$out" | sed -n '/^Deleted Networks:/,$p' | tail -n +2 | grep -c .)
    	log "pruned $count network(s)"
    }

    # Reap unused anonymous AND named volumes left inside the dockerd
    # daemon by a finished job. Run only after cleanup_containers, so
    # nothing in use is removed. This never touches the image or build
    # cache, which live elsewhere under /var/lib/docker.
    prune_volumes() {
    	out=$(docker volume prune --all --force 2>/dev/null) || true
    	reclaimed=$(printf '%s\n' "$out" | sed -n 's/^Total reclaimed space: //p')
    	log "pruned volumes, reclaimed ${reclaimed:-0B}"
    }

    # Empty the shared /workspace mount (builds, plugins, and anything
    # else a prior job wrote) without removing the mountpoint itself.
    # The supervisor is unprivileged and does not mount /workspace, so
    # the wipe runs as root inside the dockerd daemon via a throwaway
    # container that bind-mounts the same host path the agent uses.
    # This can remove root-owned build output the supervisor could not.
    # Relies on AGENT_IMAGE already being present (ensured in start_agent).
    clean_workspace() {
    	log "wiping /workspace"
    	docker run --rm --pull never --network none --user 0 --entrypoint sh \
    		--volume /workspace:/workspace "$AGENT_IMAGE" \
    		-c 'rm -rf /workspace/* /workspace/.[!.]* /workspace/..?*' >/dev/null 2>&1 || true
    }

    prefetch_images() {
    	[ -n "${PREFETCH_IMAGES:-}" ] || return 0
    	for img in $PREFETCH_IMAGES; do
    		docker image inspect "$img" >/dev/null 2>&1 && continue
    		docker pull "$img" || echo "prefetch: failed to pull $img" >&2
    	done
    }

    shutdown() {
    	trap - TERM INT
    	stopping=1
    	log "shutdown: stopping agent and cleaning up"
    	stop_log_follower
    	if docker info >/dev/null 2>&1; then
    		stop_timeout=$((TERMINATION_GRACE_PERIOD_SECONDS - 10))
    		if [ "$stop_timeout" -lt 0 ]; then
    			stop_timeout=0
    		fi
    		docker stop --time "$stop_timeout" "$agent_name" >/dev/null 2>&1 || true
    		if [ "$cleanup" = "true" ]; then
    			cleanup_containers || true
    		fi
    	fi
    	exit 0
    }

    trap shutdown TERM INT

    wait_for_docker() {
    	while ! docker info >/dev/null 2>&1; do
    		if [ "$stopping" -eq 1 ]; then
    			return 1
    		fi
    		sleep 1
    	done
    }

    agent_running() {
    	[ "$(docker inspect --format '{{.State.Running}}' "$agent_name" 2>/dev/null)" = "true" ]
    }

    # Four random lowercase-alphanumeric characters. Regenerated for
    # each agent container so every (re)start registers under a fresh
    # BUILDKITE_AGENT_NAME rather than colliding with the previous,
    # still-draining agent of the same name on the Buildkite side.
    random_suffix() {
    	LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c 4
    }

    start_agent() {
    	# Ensure the agent image is present before cleanup runs:
    	# clean_workspace reuses it (docker run ... --pull never) to wipe
    	# /workspace as root inside the daemon.
    	if ! docker image inspect "$AGENT_IMAGE" >/dev/null 2>&1; then
    		docker pull "$AGENT_IMAGE" || return 1
    	fi

    	# Between-job cleanup is governed solely by CLEANUP, independent
    	# of SINGLE_USE (which only chooses the agent process lifecycle).
    	if [ "$cleanup" = "true" ]; then
    		# Reset per-job state so the next agent starts clean: reap
    		# leftover containers and networks, wipe /workspace and prune
    		# daemon volumes. The image/build cache is always retained.
    		cleanup_containers || return 1
    		prune_networks
    		clean_workspace
    		prune_volumes
    	else
    		# Cleanup disabled: leave the previous job's containers,
    		# networks, volumes and /workspace in place for inspection,
    		# but still remove the prior agent container so its name is
    		# free for the replacement started below.
    		log "cleanup disabled: leaving previous job state in place"
    		docker rm --force --volumes "$agent_name" >/dev/null 2>&1 || true
    	fi

    	# Unique per container start so we can observe them in
        # /workspace/builds and /workspace/plugins
    	bk_agent_name="${POD_NAME}-$(random_suffix)"

    	set -- docker run --detach --pull never \
    		--name "$agent_name" \
    		--hostname "$POD_NAME" \
    		--group-add 2375 \
    		--publish 8080:8080 \
    		--volume /var/run/docker.sock:/var/run/docker.sock \
    		--volume /workspace:/workspace \
    		--env BUILDKITE_AGENT_TOKEN \
    		--env "BUILDKITE_AGENT_TAGS=$AGENT_TAGS" \
    		--env "BUILDKITE_AGENT_NAME=$bk_agent_name" \
    		--env BUILDKITE_AGENT_HEALTH_CHECK_ADDR=0.0.0.0:8080 \
    		--env BUILDKITE_BUILD_PATH=/workspace/builds \
    		--env BUILDKITE_PLUGINS_PATH=/workspace/plugins \
    		--env DOCKER_HOST=unix:///var/run/docker.sock

    	if [ -n "${DOCKER_CONFIG:-}" ]; then
    		set -- "$@" \
    			--volume "$DOCKER_CONFIG:$DOCKER_CONFIG:ro" \
    			--env "DOCKER_CONFIG=$DOCKER_CONFIG"
    	fi

    	set -- "$@" "$AGENT_IMAGE"
    	if [ "$SINGLE_USE" = "true" ]; then
    		# Image arguments replace its default "start" command.
    		set -- "$@" start --disconnect-after-job
    	fi
    	"$@" >/dev/null
    }

    follow_agent_logs() {
    	if [ "$1" = "adopted" ]; then
    		docker logs --tail 0 --follow "$agent_name" &
    	else
    		docker logs --follow "$agent_name" &
    	fi
    	log_pid=$!
    }

    while [ "$stopping" -eq 0 ]; do
    	wait_for_docker || break

    	if [ "$prefetched" -eq 0 ]; then
    		prefetch_images
    		prefetched=1
    	fi

    	if agent_running; then
    		follow_agent_logs adopted
    	else
    		if ! start_agent; then
    			sleep 5
    			continue
    		fi
    		follow_agent_logs new
    	fi

    	docker wait "$agent_name" >/dev/null 2>&1 &
    	wait_pid=$!
    	wait "$wait_pid" >/dev/null 2>&1 || true
    	stop_log_follower

    	if [ "$stopping" -eq 1 ]; then
    		break
    	fi
    	if ! docker info >/dev/null 2>&1; then
    		continue
    	fi
    	if agent_running; then
    		continue
    	fi

    	if [ "$cleanup" = "true" ]; then
    		cleanup_containers || true
    		prune_networks
    	fi
    	sleep 1
    done
