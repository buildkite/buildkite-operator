# Buildkite agent token consumed by the dind-runner Deployment.
# Replace the placeholder with a real Buildkite agent token so the inner agent
# actually connects, then apply this file before deployment.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: buildkite-agent-token
  labels:
    app.kubernetes.io/name: buildkite-agent
    app.kubernetes.io/instance: dind-runner
stringData:
  token: not-a-real-agent-token
