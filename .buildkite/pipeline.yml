common:
  go_container: &go_container
    - docker#v5.14.0:
        image: golang:1.26.5
        propagate-uid-gid: true
        environment:
          - HOME=/tmp

steps:
  - label: ":golang: lint"
    command: make lint
    plugins: *go_container

  - label: ":wrench: codegen is up to date"
    command:
      - make manifests generate fmt vet
      - test -z "$(git status --porcelain)"
    plugins: *go_container

  - label: ":test_tube: test"
    command: make test
    plugins: *go_container

  # Runs on a bare agent (needs Docker and Kind, so not in the go container).
  # mise provides Go, kubebuilder and kubectl; `mise exec` puts them on PATH for
  # make and the kubectl calls the e2e tests shell out to.
  - label: ":kubernetes: e2e"
    command:
      - curl -fsSL https://mise.run | sh
      - export PATH="$$HOME/.local/bin:$$PATH"
      - mise install
      - mise exec -- make test-e2e
