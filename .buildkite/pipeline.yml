common:
  go_container: &go_container
    - docker#v5.14.0:
        image: golang:1.26.5
        propagate-uid-gid: true
        environment:
          - HOME=/tmp

steps:
  - label: ":golang: lint"
    command: make lint
    plugins: *go_container

  - label: ":wrench: codegen is up to date"
    command:
      - make manifests generate fmt vet
      - test -z "$(git status --porcelain)"
    plugins: *go_container

  - label: ":test_tube: test"
    command: make test
    plugins: *go_container

  - label: ":kubernetes: chart examples are up to date"
    command:
      - curl -fsSL https://mise.run | sh
      - export PATH="$$HOME/.local/bin:$$PATH"
      - mise install helm
      - make helm-examples HELM="$(mise which helm)"
      - git diff --exit-code
      - test -z "$(git status --porcelain)"

  - label: ":kubernetes: standalone chart"
    command:
      - curl -fsSL https://mise.run | sh
      - export PATH="$$HOME/.local/bin:$$PATH"
      - mise install
      - mise exec -- make test-helm
      - mise exec -- make test-supervisor
      - test -z "$(git status --porcelain)"
      - mise exec -- make test-helm-e2e
