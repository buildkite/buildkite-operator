events {}
http {
    resolver @DNS@ ipv6=off;
    log_format registry escape=json
        '{"method":"$request_method","path":"$uri","source":"$content_source","status":$status}';
    access_log /dev/stdout registry;
    error_log /dev/stderr;
    proxy_buffering off;

    # Docker's native registry mirrors only cover Docker Hub, so the ECR test
    # needs a TLS front to keep the existing image name.
    # The puller waits for a Pod to populate node containerd on a manifest miss.
    server {
        listen 8443 ssl;
        server_name public.ecr.aws;
        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        set $content_source upstream;

        location /v2/ {
            set $content_source spegel;
            proxy_set_header Host public.ecr.aws;
            proxy_set_header Authorization "";
            proxy_intercept_errors on;
            error_page 404 = @fill;
            error_page 400 401 405 500 502 503 504 = @upstream;
            proxy_pass http://@SPEGEL_HOST@:5000$uri?ns=public.ecr.aws&$args;
        }

        location @fill {
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @upstream;
            proxy_read_timeout 180s;
            proxy_pass http://127.0.0.1:8080;
        }

        # Retry once after the puller confirms availability. A miss here goes
        # upstream instead of triggering another fill and creating a loop.
        location @spegel_retry {
            set $content_source spegel;
            proxy_set_header Host public.ecr.aws;
            proxy_set_header Authorization "";
            proxy_intercept_errors on;
            error_page 400 401 404 405 500 502 503 504 = @upstream;
            proxy_pass http://@SPEGEL_HOST@:5000$uri?ns=public.ecr.aws&$args;
        }

        location @upstream {
            set $content_source upstream;
            proxy_set_header Host public.ecr.aws;
            proxy_set_header Authorization $http_authorization;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_pass https://public.ecr.aws;
        }

        location / {
            proxy_set_header Host public.ecr.aws;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_pass https://public.ecr.aws;
        }
    }
}
