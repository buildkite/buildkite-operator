# Source: buildkite-operator/templates/runners.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkite-linux
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-0.18.0
    app.kubernetes.io/component: runner
    buildkite.com/runner-pool: "linux"
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkite-operator
      app.kubernetes.io/instance: buildkite
      app.kubernetes.io/component: runner
      buildkite.com/runner-pool: "linux"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkite-operator
        app.kubernetes.io/instance: buildkite
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: buildkite-operator-0.18.0
        app.kubernetes.io/component: runner
        buildkite.com/runner-pool: "linux"
      annotations:
        # Roll agents when the chart-managed token changes; they read it at startup.
        checksum/agent-token: 4a0b7efcc66677c05d97ed1c128f7dcdf1b172c4c377feb96f353849f3d79fd5
        # Treat agents as busy until the sidecar observes that they are idle.
        controller.kubernetes.io/pod-deletion-cost: "100"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        checksum/deletion-cost: d934da1013c51e1f0566d497e55f022b8670b9d85b56dc473a2096d77f28bf2e
    spec:
      serviceAccountName: buildkite-buildkite-operator-deletion-cost
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3600
      containers:
        - name: agent
          image: "buildkite/agent:4"
          imagePullPolicy: Always
          command: ["/usr/local/bin/buildkite-agent"]
          args: ["start"]
          env:
            - name: BUILDKITE_AGENT_CONFIG
              value: /dev/null
            - name: BUILDKITE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: buildkite-buildkite-operator-agent-token
                  key: token
            - name: BUILDKITE_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BUILDKITE_AGENT_TAGS
              value: "queue=linux,runtime=standard"
            - name: BUILDKITE_AGENT_HEALTH_CHECK_ADDR
              value: 0.0.0.0:8080
            - name: BUILDKITE_BUILD_PATH
              value: /buildkite/builds
            # The agent cannot check out plugins without a plugins path.
            - name: BUILDKITE_PLUGINS_PATH
              value: /buildkite/plugins
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /agent/1
              port: health
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
          resources:
            {}
        - name: deletion-cost
          image: "python:3.12.14-alpine3.24@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111"
          imagePullPolicy: IfNotPresent
          # As PID 1, Python ignores SIGTERM until its handler is installed, so a
          # Pod removed during startup would wait out the full grace period.
          command:
            - /bin/sh
            - -c
            - trap 'exit 0' TERM; python3 -u /opt/deletion-cost/deletion_cost.py & wait $!
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: deletion-cost-code
              mountPath: /opt/deletion-cost
              readOnly: true
            - name: deletion-cost-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: deletion-cost-code
          configMap:
            name: buildkite-buildkite-operator-deletion-cost
        - name: deletion-cost-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt

