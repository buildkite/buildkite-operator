apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: buildkite-linux
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-0.18.0
    buildkite.com/runner-pool: "linux"
spec:
  scaleTargetRef:
    name: buildkite-linux
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 1
  maxReplicaCount: 4
  advanced:
    scalingModifiers:
      formula: scheduled + running
      target: "1"
      activationTarget: "0"
      metricType: AverageValue
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 5
              periodSeconds: 15
  triggers:
    - type: metrics-api
      name: scheduled
      metadata:
        url: https://agent.buildkite.com/v3/metrics
        valueLocation: "jobs.queues.linux.scheduled"
        targetValue: "1"
        authMode: apiKey
        keyParamName: Authorization
      authenticationRef:
        name: buildkite-buildkite-operator-metrics
    - type: metrics-api
      name: running
      metadata:
        url: https://agent.buildkite.com/v3/metrics
        valueLocation: "jobs.queues.linux.running"
        targetValue: "1"
        authMode: apiKey
        keyParamName: Authorization
      authenticationRef:
        name: buildkite-buildkite-operator-metrics

