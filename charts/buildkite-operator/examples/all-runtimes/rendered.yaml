# Source: buildkite-operator-chart/templates/oci-accelerator.yaml
apiVersion: v1
kind: Service
metadata:
  name: buildkite-buildkite-operator-oci-accelerator-peers
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-chart-0.22.0
    app.kubernetes.io/component: oci-accelerator
spec:
  clusterIP: None
  # Bootstrap must not depend on another peer becoming ready first.
  publishNotReadyAddresses: true
  selector:
