# Source: buildkite-operator-chart/templates/oci-accelerator-ca.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: buildkite-buildkite-operator-oci-accelerator-ca-create
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-chart-0.22.0
    app.kubernetes.io/component: oci-accelerator-ca
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkite-operator
        app.kubernetes.io/instance: buildkite
        app.kubernetes.io/component: oci-accelerator-ca
    spec:
      serviceAccountName: buildkite-buildkite-operator-oci-accelerator-ca-hook
      automountServiceAccountToken: false
      restartPolicy: Never
      # The accelerator's user, so the create step can read the generated key.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # init-ca requires an owner-controlled parent directory, which an
        # emptyDir mount is not.
        - name: init-ca
          image: "buildkite/oci-accelerator:v0.5.0@sha256:c671b75f349cf625fdd7555c632f17782d6b98ed7c21bc5fa8bdcf6426ab0578"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - mkdir -m 0700 /work/state && oci-accelerator init-ca --dir /work/state/ca
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        # Reuses the chart's pinned Python image to call the Kubernetes API.
        - name: create-ca
          image: "python:3.12.14-alpine3.24@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111"
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/opt/oci-accelerator-ca/oci_accelerator_ca.py", "create"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIGMAP_NAME
              value: "buildkite-buildkite-operator-oci-accelerator-ca-cert"
            - name: SECRET_NAME
              value: "buildkite-buildkite-operator-oci-accelerator-ca"
            - name: CERTIFICATE_KEY
              value: "ca.crt"
            - name: PRIVATE_KEY_KEY
              value: "ca.key"
            - name: CA_DIR
              value: /work/state/ca
            - name: LABELS
              value: "{\"app.kubernetes.io/component\":\"oci-accelerator-ca\",\"app.kubernetes.io/instance\":\"buildkite\",\"app.kubernetes.io/name\":\"buildkite-operator\"}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: code
              mountPath: /opt/oci-accelerator-ca
              readOnly: true
            - name: api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: work
              mountPath: /work
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: buildkite-buildkite-operator-oci-accelerator-ca-hook
        - name: api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

