          # for it, where it would be evicted once the cache filled.
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              ephemeral-storage: 20Gi
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /run/oci-accelerator
            - name: cache
              mountPath: /var/cache/oci-accelerator
      volumes:
        - name: ca-source
          secret:
            secretName: "buildkite-buildkite-operator-oci-accelerator-ca"
            defaultMode: 0440
            items:
              - key: "ca.crt"
                path: ca.crt
              - key: "ca.key"
                path: ca.key
        - name: state
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: cache
          emptyDir:
            sizeLimit: 20Gi

