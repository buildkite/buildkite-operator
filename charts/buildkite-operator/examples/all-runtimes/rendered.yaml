apiVersion: batch/v1
kind: Job
metadata:
  name: buildkite-buildkite-operator-oci-accelerator-ca-create
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-0.9.0
    app.kubernetes.io/component: oci-accelerator-ca
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkite-operator
        app.kubernetes.io/instance: buildkite
        app.kubernetes.io/component: oci-accelerator-ca
    spec:
      serviceAccountName: buildkite-buildkite-operator-oci-accelerator-ca-hook
      automountServiceAccountToken: false
      restartPolicy: Never
      # The proxy's user, so the Secret step can read the generated private key.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # The Pod briefly holds the CA private key, so it runs where the proxy does.
      initContainers:
        # init-ca requires an owner-controlled parent directory, which an
        # emptyDir mount is not.
        - name: init-ca
          image: "buildkite/oci-accelerator:v0.2.1@sha256:a26eb344cc4858ccd63a92150a7deaf11766e3a5155add2c00e4dad4a5fec6cf"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - mkdir -m 0700 /work/state && oci-accelerator init-ca --dir /work/state/ca
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        # Reuses the chart's pinned Python image to call the Kubernetes API.
        - name: create-secret
          image: "python:3.12.14-alpine3.24@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111"
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/opt/oci-accelerator-ca/oci_accelerator_ca.py", "create"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: "buildkite-buildkite-operator-oci-accelerator-ca"
            - name: CERTIFICATE_KEY
              value: "ca.crt"
            - name: PRIVATE_KEY_KEY
              value: "ca.key"
            - name: CA_DIR
              value: /work/state/ca
            - name: SECRET_LABELS
              value: "{\"app.kubernetes.io/component\":\"oci-accelerator-ca\",\"app.kubernetes.io/instance\":\"buildkite\",\"app.kubernetes.io/name\":\"buildkite-operator\"}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: code
              mountPath: /opt/oci-accelerator-ca
              readOnly: true
            - name: api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: work
              mountPath: /work
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: buildkite-buildkite-operator-oci-accelerator-ca-hook
        - name: api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

