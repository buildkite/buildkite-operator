    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-chart-0.22.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildkite-buildkite-operator-deletion-cost
subjects:
  - kind: ServiceAccount
    name: buildkite-buildkite-operator-deletion-cost
    namespace: buildkite

