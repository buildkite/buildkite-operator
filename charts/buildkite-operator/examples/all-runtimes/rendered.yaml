# Source: buildkite-operator-chart/templates/deletion-cost.yaml
# Deployment Pods have generated names, so this Role cannot be limited to each
# Pod patching only itself; deletionCost.admissionPolicy adds that limit.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildkite-buildkite-operator-deletion-cost
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-chart-0.22.0
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]

---
# Source: buildkite-operator-chart/templates/deletion-cost.yaml
apiVersion: rbac.authorization.k8s.io/v1
