# Source: buildkite-operator-chart/templates/deletion-cost.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkite-buildkite-operator-deletion-cost
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-chart-0.22.0
data:
  deletion_cost.py: |-
    """Prefer removing idle agents during scale-in (best effort, not a drain).
    
    Busy agents get a pod-deletion-cost, which the ReplicaSet uses to pick scale-in
    victims, and are marked not safe to evict, which stops Cluster Autoscaler from
    removing their node.
    """
    
    import http.client
    import json
    import os
    import signal
    import ssl
    import sys
    import time
    import urllib.parse
    import urllib.request
    
    
    DELETION_COST = "controller.kubernetes.io/pod-deletion-cost"
    SAFE_TO_EVICT = "cluster-autoscaler.kubernetes.io/safe-to-evict"
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    
    
    def agent_busy():
        with urllib.request.urlopen("http://127.0.0.1:8080/status.json", timeout=2) as response:
            status = json.loads(response.read(4096))["aggregate_status"]
        if status == "idle":
            return False
        if status == "busy":
            return True
        raise ValueError(f"unknown agent status: {status}")
    
    
    def annotations(busy):
        if busy:
            return {DELETION_COST: "100", SAFE_TO_EVICT: "false"}
        # Removing the cost restores Kubernetes' implicit cost of 0. Idle Pods need
        # an explicit "true": Cluster Autoscaler won't remove a node running Pods
        # with disk-backed emptyDir volumes by default.
        return {DELETION_COST: None, SAFE_TO_EVICT: "true"}
    
    
    def patch_annotations(values):
        namespace = urllib.parse.quote(os.environ["POD_NAMESPACE"], safe="")
        name = urllib.parse.quote(os.environ["POD_NAME"], safe="")
        host = os.environ["KUBERNETES_SERVICE_HOST"]
        port = os.environ["KUBERNETES_SERVICE_PORT_HTTPS"]
        url = f"https://{host}:{port}/api/v1/namespaces/{namespace}/pods/{name}"
        with open(TOKEN_PATH, encoding="utf-8") as token:
            authorization = f"Bearer {token.read().strip()}"
        body = json.dumps({"metadata": {"annotations": values}}).encode()
        request = urllib.request.Request(
            url, data=body, method="PATCH",
            headers={"Authorization": authorization, "Content-Type": "application/merge-patch+json"},
        )
        with urllib.request.urlopen(request, context=ssl.create_default_context(cafile=CA_PATH), timeout=3):
            pass
    
    
    def run():
        applied = object()  # Reconcile on startup, including after a sidecar restart.
        while True:
            try:
                busy = agent_busy()
            # urllib only wraps connection errors in URLError; errors while reading
            # the response, such as a reset while the agent restarts, surface raw.
            except (OSError, http.client.HTTPException, ValueError, KeyError) as error:
                print(f"Agent status unavailable; preferring retention: {error}", flush=True)
                busy = True
    
            if busy != applied:
                try:
                    patch_annotations(annotations(busy))
                except (OSError, http.client.HTTPException) as error:
                    print(f"Could not update scale-in annotations; retrying: {error}", flush=True)
                else:
                    print(f"Marked Pod {'busy' if busy else 'idle'}", flush=True)
                    applied = busy
            time.sleep(1)
    
    
    if __name__ == "__main__":
        # The chart's shell wrapper exits on SIGTERM even before this handler is
        # installed; this keeps the script responsive when run directly.
        signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
        run()
    

---
# Source: buildkite-operator-chart/templates/ephemeral-agent.yaml
# supervisor.sh runs dind, kata and sysbox ephemeral agents; ephemeral-agent.sh
# runs standard ones.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkite-buildkite-operator-ephemeral-agent
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-chart-0.22.0
data:
  ephemeral-agent.sh: |-
    #!/bin/sh
    # Runs ephemeral agents for the standard runtime: each agent disconnects after
    # one job, then this loop clears the workspace and starts a newly registered
    # agent. The container itself keeps running, so the kubelet's restart backoff
    # never applies. Only the build and plugin directories are reset; the rest of
    # the container's filesystem persists across jobs.
    set -u
    
    base_name="${BUILDKITE_AGENT_NAME:?}"
    build_path="${BUILDKITE_BUILD_PATH:?}"
    plugins_path="${BUILDKITE_PLUGINS_PATH:?}"
    stopping=0
    agent_pid=""
    
    log() { printf 'ephemeral-agent: %s\n' "$*"; }
    
    # The kubelet signals only PID 1. The agent finishes its current job on the
    # first SIGTERM but cancels it on a second, so forward exactly one.
    shutdown() {
    	if [ "$stopping" -eq 0 ] && [ -n "$agent_pid" ]; then
    		log "Stopping agent"
    		kill -TERM "$agent_pid" 2>/dev/null || true
    	fi
    	stopping=1
    }
    trap shutdown TERM INT
    
    # Waits in the background so a signal interrupts the shell's wait builtin.
    pause() {
    	sleep "$1" &
    	wait $! || true
    }
    
    # A fresh name per agent avoids colliding with the previous agent while
    # Buildkite finishes disconnecting it.
    random_suffix() {
    	LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c 4
    }
    
    clean_workspace() {
    	for dir in "$build_path" "$plugins_path"; do
    		rm -rf "${dir:?}"/* "$dir"/.[!.]* "$dir"/..?* || return 1
    	done
    }
    
    while [ "$stopping" -eq 0 ]; do
    	# A failure blocks the next agent so a job never starts on unclean state.
    	if ! clean_workspace; then
    		log "Could not clean workspace; retrying"
    		pause 5
    		continue
    	fi
    
    	agent_name="${base_name}-$(random_suffix)"
    	log "Starting agent $agent_name"
    	BUILDKITE_AGENT_NAME="$agent_name" /usr/local/bin/buildkite-agent start --disconnect-after-job &
    	agent_pid=$!
    	# A signal that arrived before agent_pid was set was not forwarded. The new
    	# agent cannot have a job yet, so a second SIGTERM here would be harmless.
    	if [ "$stopping" -eq 1 ]; then
    		kill -TERM "$agent_pid" 2>/dev/null || true
    	fi
    
    	# wait returns early when a signal arrives; keep waiting for the agent.
    	while :; do
    		wait "$agent_pid"
    		status=$?
    		if [ "$status" -gt 128 ] && kill -0 "$agent_pid" 2>/dev/null; then
    			continue
    		fi
    		break
    	done
    	agent_pid=""
    
    	if [ "$stopping" -eq 1 ]; then
    		break
    	fi
    	log "Agent exited with status $status"
    	if [ "$status" -ne 0 ]; then
    		# Avoid re-registering in a tight loop when the agent cannot start.
    		pause 5
    	fi
    done
    log "Stopped"
    
  supervisor.sh: |-
    #!/bin/sh
    # Runs each Buildkite job in a fresh agent container inside the Pod's Docker
    # daemon. The agent exits after one job; the supervisor clears the job's state
    # and starts a replacement. The Pod, its node, and the Docker image and build
    # caches persist across jobs.
    set -u
    
    agent_container="buildkite-agent"
    stopping=0
    log_pid=""
    
    log() { printf 'supervisor: %s\n' "$*"; }
    
    stop_log_follower() {
    	if [ -n "$log_pid" ]; then
    		kill "$log_pid" >/dev/null 2>&1 || true
    		wait "$log_pid" >/dev/null 2>&1 || true
    		log_pid=""
    	fi
    }
    
    shutdown() {
    	trap - TERM INT
    	stopping=1
    	log "Stopping agent"
    	stop_log_follower
    	if docker info >/dev/null 2>&1; then
    		# Leave time for the daemon to stop after the agent drains its job.
    		timeout=$((TERMINATION_GRACE_PERIOD_SECONDS - 10))
    		if [ "$timeout" -lt 0 ]; then
    			timeout=0
    		fi
    		docker stop --time "$timeout" "$agent_container" >/dev/null 2>&1 || true
    	fi
    	exit 0
    }
    
    trap shutdown TERM INT
    
    wait_for_docker() {
    	while ! docker info >/dev/null 2>&1; do
    		if [ "$stopping" -eq 1 ]; then
    			return 1
    		fi
    		sleep 1
    	done
    }
    
    agent_running() {
    	[ "$(docker inspect --format '{{.State.Running}}' "$agent_container" 2>/dev/null)" = "true" ]
    }
    
    # A fresh name per agent avoids colliding with the previous agent while
    # Buildkite finishes disconnecting it.
    random_suffix() {
    	LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c 4
    }
    
    # Remove everything the previous job left in the daemon and workspace. The
    # image and build caches are kept. A failure blocks the next agent so a job
    # never starts on unclean state.
    clean_job_state() {
    	containers=$(docker ps --all --quiet) || return 1
    	if [ -n "$containers" ]; then
    		log "Removing $(printf '%s\n' "$containers" | wc -l | tr -d ' ') container(s)"
    		# Docker's newline-separated IDs must be separate arguments.
    		# shellcheck disable=SC2086
    		docker rm --force --volumes $containers >/dev/null || return 1
    	fi
    	docker network prune --force >/dev/null || return 1
    	docker volume prune --all --force >/dev/null || return 1
    	# The supervisor cannot write the workspace, so clear the daemon's copy as
    	# root in a throwaway container.
    	docker run --rm --pull never --network none --user 0 --entrypoint /bin/sh \
    		--volume /buildkite:/buildkite "$AGENT_IMAGE" \
    		-c 'rm -rf /buildkite/* /buildkite/.[!.]* /buildkite/..?*' || return 1
    	log "Cleaned job state"
    }
    
    start_agent() {
    	for image in "$AGENT_IMAGE" "${AGENT_RUNTIME_IMAGE:-}"; do
    		[ -n "$image" ] || continue
    		if ! docker image inspect "$image" >/dev/null 2>&1; then
    			log "Pulling $image"
    			docker pull --quiet "$image" >/dev/null || return 1
    		fi
    	done
    
    	clean_job_state || return 1
    
    	# With step images, each agent runs jobs through the step-image script,
    	# which the Docker daemon's container has at the same path.
    	set --
    	if [ -n "${STEP_IMAGE_SCRIPT:-}" ]; then
    		set -- --volume "${STEP_IMAGE_SCRIPT%/*}:${STEP_IMAGE_SCRIPT%/*}:ro" \
    			--env "BUILDKITE_BOOTSTRAP_SCRIPT_PATH=/bin/sh $STEP_IMAGE_SCRIPT" \
    			--env BUILDKITE_JOB_CONTEXT_DIR=/buildkite/job-context \
    			--env DEFAULT_STEP_IMAGE
    	fi
    
    	if [ -n "${RUNNER_CPU_LIMIT_MILLICORES:-}" ]; then
    		set -- "$@" --cpu-period 100000 \
    			--cpu-quota "$((RUNNER_CPU_LIMIT_MILLICORES < 10 ? 1000 : RUNNER_CPU_LIMIT_MILLICORES * 100))" \
    			--env RUNNER_CPU_LIMIT_MILLICORES
    	fi
    
    	image="$AGENT_IMAGE"
    	agent_binary=/usr/local/bin/buildkite-agent
    	agent_command="$agent_binary"
    	if [ -n "${AGENT_RUNTIME_IMAGE:-}" ]; then
    		case "$(docker info --format '{{json .DriverStatus}}')" in
    		*io.containerd.snapshotter.v1*) ;;
    		*) log "agentRuntimeImage requires Docker's containerd image store"; return 1 ;;
    		esac
    		image="$AGENT_RUNTIME_IMAGE"
    		agent_binary=/opt/buildkite-agent-source/usr/local/bin/buildkite-agent
    		# Run the shared copy so the agent's BUILDKITE_BIN_PATH is also visible
    		# to sibling containers: they do not inherit the source image mount.
    		agent_command=/buildkite/bin/buildkite-agent
    		set -- "$@" --mount "type=image,source=$AGENT_IMAGE,target=/opt/buildkite-agent-source,readonly"
    	fi
    
    	agent_name="${POD_NAME}-$(random_suffix)"
    	log "Starting agent $agent_name"
    	# DOCKER_CONFIG is at the same path in the Docker daemon's container, so
    	# every agent shares the Pod's registry credentials and logins. The daemon
    	# resolves bind-mount sources in that container, which shares only the
    	# workspace with the agent, so jobs whose plugins mount the agent binary
    	# (mount-buildkite-agent) find a copy there first on PATH.
    	docker run --detach --pull never \
    		--stop-signal SIGTERM \
    		--name "$agent_container" \
    		--hostname "$POD_NAME" \
    		--publish 8080:8080 \
    		--volume /var/run/docker.sock:/var/run/docker.sock \
    		--volume /buildkite:/buildkite \
    		--volume "$DOCKER_CONFIG:$DOCKER_CONFIG" \
    		--env DOCKER_CONFIG \
    		--entrypoint /bin/sh \
    		--env BUILDKITE_AGENT_CONFIG=/dev/null \
    		--env BUILDKITE_AGENT_TOKEN \
    		--env "BUILDKITE_AGENT_NAME=$agent_name" \
    		--env "BUILDKITE_AGENT_TAGS=$AGENT_TAGS" \
    		--env BUILDKITE_AGENT_HEALTH_CHECK_ADDR=0.0.0.0:8080 \
    		--env BUILDKITE_BUILD_PATH=/buildkite/builds \
    		--env BUILDKITE_PLUGINS_PATH=/buildkite/plugins \
    		--env BUILDKITE_SOCKETS_PATH=/buildkite/sockets \
    		--env DOCKER_HOST=unix:///var/run/docker.sock \
    		"$@" \
    		"$image" -c 'mkdir -p /buildkite/bin &&
    			cp "$1" /buildkite/bin/buildkite-agent &&
    			export PATH="/buildkite/bin:$PATH" &&
    			exec "$2" start --disconnect-after-job' agent "$agent_binary" "$agent_command" >/dev/null
    }
    
    follow_agent_logs() {
    	if [ "$1" = "adopted" ]; then
    		docker logs --tail 0 --follow "$agent_container" &
    	else
    		docker logs --follow "$agent_container" &
    	fi
    	log_pid=$!
    }
    
    while [ "$stopping" -eq 0 ]; do
    	wait_for_docker || break
    
    	if agent_running; then
    		log "Adopting running agent"
    		follow_agent_logs adopted
    	elif start_agent; then
    		follow_agent_logs new
    	else
    		log "Could not start agent; retrying"
    		sleep 5
    		continue
    	fi
    
    	# Wait in the background so SIGTERM interrupts the shell's wait builtin.
    	docker wait "$agent_container" >/dev/null 2>&1 &
    	wait $! || true
    	stop_log_follower
    
    	if [ "$stopping" -eq 1 ]; then
    		break
    	fi
    	status=$(docker inspect --format '{{.State.ExitCode}}' "$agent_container" 2>/dev/null || echo unknown)
    	log "Agent exited with status $status"
    	if [ "$status" != "0" ]; then
    		# Avoid re-registering in a tight loop when the agent cannot start.
    		sleep 5
    	fi
    done
    

---
# Source: buildkite-operator-chart/templates/step-image.yaml
# The agent's bootstrap-script on dind, kata and sysbox runners, which runs
# steps that set image: in that image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkite-buildkite-operator-step-image
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-chart-0.22.0
data:
  step-image.sh: |-
    #!/bin/sh
    # The agent's bootstrap-script on dind, kata and sysbox runners: the command
    # the agent runs for each job instead of `buildkite-agent bootstrap`.
    #
    # A step's image: sets BUILDKITE_IMAGE, taking precedence over DEFAULT_STEP_IMAGE.
    # Without either the job runs as usual. With an image, one full bootstrap runs
    # plugins, checkout, hooks and the command in that image. The daemon shares
    # /buildkite with the agent, so the container sees the workspace, Job API
    # socket and agent binary at the same paths.
    set -uf
    
    agent="$BUILDKITE_BIN_PATH/buildkite-agent"
    image=${BUILDKITE_IMAGE:-${DEFAULT_STEP_IMAGE:-}}
    if [ -z "$image" ]; then
    	exec "$agent" bootstrap
    fi
    export BUILDKITE_IMAGE="$image"
    
    container="buildkite-step-$BUILDKITE_JOB_ID"
    created=0
    cancelled=0
    
    # The agent kills the job's processes BUILDKITE_CANCEL_SIGNAL_TIMEOUT after
    # signalling them. A killed docker CLI would leave the container running, so
    # give it a second less to stop.
    grace=${BUILDKITE_CANCEL_SIGNAL_TIMEOUT:-10s}
    grace=${grace%s}
    case $grace in '' | *[!0-9]*) grace=10 ;; esac
    stop_timeout=$((grace > 1 ? grace - 1 : 0))
    
    # The agent signals the job's whole process group. The bootstrap stops
    # handling signals after the first, so a second would kill it during its
    # cleanup hooks, and each process must be signalled only once. docker start
    # runs in its own session, so it gets no signal to forward, and this stops
    # the container instead, which also works when only this script was
    # signalled. A container that hasn't started yet is removed, so that a
    # pending docker start fails; one that starts just then is killed outright.
    cancel() {
    	cancelled=1
    	if [ "$created" -eq 1 ]; then
    		if [ "$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null)" = created ]; then
    			docker rm --force "$container" >/dev/null 2>&1 || true
    		else
    			docker stop --time "$stop_timeout" "$container" >/dev/null 2>&1 || true
    		fi
    	fi
    }
    trap cancel TERM INT HUP QUIT
    
    # Runs a command in the background, so that signals interrupt the wait, and
    # returns its exit status once it exits.
    run() {
    	"$@" &
    	child=$!
    	while :; do
    		wait "$child"
    		status=$?
    		kill -0 "$child" 2>/dev/null || return "$status"
    	done
    }
    
    # Pass the job's environment by name, so values with newlines survive, except
    # for variables that describe the agent's container rather than the job.
    set --
    names=$(awk 'BEGIN { for (name in ENVIRON) print name }')
    IFS='
    '
    for name in $names; do
    	case $name in
    	PATH | HOME | HOSTNAME | PWD | OLDPWD | SHLVL | _ | BUILDKITE_BIN_PATH) ;;
    	*) set -- "$@" --env "$name" ;;
    	esac
    done
    unset IFS
    
    if [ -n "${RUNNER_CPU_LIMIT_MILLICORES:-}" ]; then
    	set -- "$@" --cpu-period 100000 \
    		--cpu-quota "$((RUNNER_CPU_LIMIT_MILLICORES < 10 ? 1000 : RUNNER_CPU_LIMIT_MILLICORES * 100))"
    fi
    
    # The container gets the agent binary's directory, which the bootstrap
    # appends to PATH, and the same Docker daemon and client configuration as the
    # agent. Its stop signal is the one the bootstrap handles, not the image's.
    # Creating it pulls the image if needed.
    printf '~~~ Running in %s\n' "$BUILDKITE_IMAGE"
    run docker create --rm --init --stop-signal SIGTERM --name "$container" \
    	--label "buildkite.com/job-id=$BUILDKITE_JOB_ID" \
    	--volume /buildkite:/buildkite \
    	--volume /var/run/docker.sock:/var/run/docker.sock \
    	--volume "$DOCKER_CONFIG:$DOCKER_CONFIG" \
    	"$@" \
    	--env BUILDKITE_BIN_PATH=/buildkite/bin \
    	--entrypoint /buildkite/bin/buildkite-agent \
    	"$BUILDKITE_IMAGE" bootstrap >/dev/null
    status=$?
    created=1
    if [ "$status" -ne 0 ] || [ "$cancelled" -eq 1 ]; then
    	docker rm --force "$container" >/dev/null 2>&1
    	exit $((status == 0 ? 1 : status))
    fi
    run setsid docker start --attach "$container"
    

