# Source: buildkite-operator/templates/deletion-cost.yaml
# Deployment Pods have generated names, so this Role cannot be limited to each
# Pod patching only itself. Install the chart in a namespace dedicated to runners.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildkite-buildkite-operator-deletion-cost
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-0.8.1
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]

