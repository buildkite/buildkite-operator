apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: buildkite-docker
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-0.8.1
    buildkite.com/runner-pool: "docker"
spec:
  scaleTargetRef:
    name: buildkite-docker
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 1
  maxReplicaCount: 4
  advanced:
    scalingModifiers:
      formula: scheduled + running
      target: "1"
      activationTarget: "0"
      metricType: AverageValue
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 5
              periodSeconds: 15
  triggers:
    - type: metrics-api
      name: scheduled
      metadata:
        url: https://agent.buildkite.com/v3/metrics
        valueLocation: "jobs.queues.docker.scheduled"
        targetValue: "1"
        authMode: apiKey
        keyParamName: Authorization
      authenticationRef:
        name: buildkite-buildkite-operator-metrics
    - type: metrics-api
      name: running
      metadata:
        url: https://agent.buildkite.com/v3/metrics
        valueLocation: "jobs.queues.docker.running"
        targetValue: "1"
        authMode: apiKey
        keyParamName: Authorization
      authenticationRef:
        name: buildkite-buildkite-operator-metrics

