# Source: buildkite-operator/templates/runners.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkite-docker
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-0.9.0
    app.kubernetes.io/component: runner
    buildkite.com/runner-pool: "docker"
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkite-operator
      app.kubernetes.io/instance: buildkite
      app.kubernetes.io/component: runner
      buildkite.com/runner-pool: "docker"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkite-operator
        app.kubernetes.io/instance: buildkite
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: buildkite-operator-0.9.0
        app.kubernetes.io/component: runner
        buildkite.com/runner-pool: "docker"
      annotations:
        # Treat agents as busy until the sidecar observes that they are idle.
        controller.kubernetes.io/pod-deletion-cost: "100"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        checksum/deletion-cost: d934da1013c51e1f0566d497e55f022b8670b9d85b56dc473a2096d77f28bf2e
    spec:
      serviceAccountName: buildkite-buildkite-operator-deletion-cost
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3600
      initContainers:
        - name: dockerd
          image: "docker:29.7.2-dind"
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --https-proxy=http://buildkite-buildkite-operator-oci-accelerator.buildkite.svc:3128
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            # Docker Engine does not read certs.d for Docker Hub with the
