---
# Source: buildkite-operator/templates/oci-accelerator.yaml
# Each proxy Pod caches in its own emptyDir, so more replicas would only split
# the cache. A rollout starts the replacement before stopping the old Pod, so
# pulls keep working; the new Pod starts with an empty cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkite-buildkite-operator-oci-accelerator
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-0.9.0
    app.kubernetes.io/component: oci-accelerator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkite-operator
      app.kubernetes.io/instance: buildkite
      app.kubernetes.io/component: oci-accelerator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkite-operator
        app.kubernetes.io/instance: buildkite
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: buildkite-operator-0.9.0
        app.kubernetes.io/component: oci-accelerator
    spec:
      automountServiceAccountToken: false
      # Longer than the proxy's default 15 second drain.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The proxy requires private, non-symlink state directories owned by
        # its user, which Secret and volume mounts do not provide directly.
        - name: prepare-state
          image: "buildkite/oci-accelerator:v0.2.1@sha256:a26eb344cc4858ccd63a92150a7deaf11766e3a5155add2c00e4dad4a5fec6cf"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              mkdir -p /run/oci-accelerator/private /var/cache/oci-accelerator/private
              chmod 0700 /run/oci-accelerator/private /var/cache/oci-accelerator/private
              rm -rf /run/oci-accelerator/private/ca
              mkdir /run/oci-accelerator/private/ca
              cp /ca-source/ca.crt /ca-source/ca.key /run/oci-accelerator/private/ca/
              chmod 0644 /run/oci-accelerator/private/ca/ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: ca-source
              mountPath: /ca-source
              readOnly: true
            - name: state
              mountPath: /run/oci-accelerator
            - name: cache
              mountPath: /var/cache/oci-accelerator
      containers:
        - name: oci-accelerator
          image: "buildkite/oci-accelerator:v0.2.1@sha256:a26eb344cc4858ccd63a92150a7deaf11766e3a5155add2c00e4dad4a5fec6cf"
          imagePullPolicy: IfNotPresent
          env:
            - name: OCI_ACCELERATOR_REGISTRIES
              value: "registry-1.docker.io,ghcr.io,public.ecr.aws"
            - name: OCI_ACCELERATOR_LISTEN
              value: 0.0.0.0:3128
            - name: OCI_ACCELERATOR_METRICS_LISTEN
              value: 127.0.0.1:9090
            - name: OCI_ACCELERATOR_CA_DIR
              value: /run/oci-accelerator/private/ca
            - name: OCI_ACCELERATOR_CACHE_DIR
              value: /var/cache/oci-accelerator/private/cache
            - name: OCI_ACCELERATOR_CACHE_MAX_BYTES
              value: "19327352832"
          ports:
            - name: proxy
              containerPort: 3128
          # Probes use the loopback metrics listener, so it is never exposed.
          startupProbe:
            exec:
              command: [wget, -Y, "off", -q, -T, "2", -O, /dev/null, http://127.0.0.1:9090/readyz]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [wget, -Y, "off", -q, -T, "2", -O, /dev/null, http://127.0.0.1:9090/readyz]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [wget, -Y, "off", -q, -T, "2", -O, /dev/null, http://127.0.0.1:9090/livez]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Requesting the cache's size keeps the Pod off nodes without the disk
          # for it, where it would be evicted once the cache filled.
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 500m
              ephemeral-storage: 20Gi
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /run/oci-accelerator
            - name: cache
              mountPath: /var/cache/oci-accelerator
      volumes:
        - name: ca-source
          secret:
            secretName: "buildkite-buildkite-operator-oci-accelerator-ca"
            defaultMode: 0440
            items:
              - key: "ca.crt"
                path: ca.crt
              - key: "ca.key"
                path: ca.key
        - name: state
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: cache
          emptyDir:
            sizeLimit: 20Gi

