# Source: buildkite-operator/templates/runners.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkite-docker
  namespace: buildkite
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/instance: buildkite
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: buildkite-operator-0.8.1
    app.kubernetes.io/component: runner
    buildkite.com/runner-pool: "docker"
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkite-operator
      app.kubernetes.io/instance: buildkite
      app.kubernetes.io/component: runner
      buildkite.com/runner-pool: "docker"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkite-operator
        app.kubernetes.io/instance: buildkite
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: buildkite-operator-0.8.1
        app.kubernetes.io/component: runner
        buildkite.com/runner-pool: "docker"
      annotations:
        # Treat agents as busy until the sidecar observes that they are idle.
        controller.kubernetes.io/pod-deletion-cost: "100"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        checksum/deletion-cost: d934da1013c51e1f0566d497e55f022b8670b9d85b56dc473a2096d77f28bf2e
    spec:
      serviceAccountName: buildkite-buildkite-operator-deletion-cost
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 3600
      initContainers:
        - name: dockerd
          image: "docker:29.7.2-dind"
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          # Sysbox's dockerd runs unprivileged: sysbox-runc isolates it in the
          # Pod's user namespace. Kata's is privileged, but only inside the VM.
          # Dind's is privileged on the node itself, with host-level access.
          securityContext:
            privileged: true
          startupProbe:
            exec:
              command: [docker, info]
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "4"
              ephemeral-storage: 50Gi
              memory: 8Gi
            requests:
              cpu: "2"
              ephemeral-storage: 15Gi
              memory: 4Gi
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
            - name: docker-run
              mountPath: /var/run
            - name: workspace
              mountPath: /buildkite
      containers:
        - name: agent
          image: "buildkite/agent:4"
          imagePullPolicy: Always
          command: ["/usr/local/bin/buildkite-agent"]
          args: ["start"]
          env:
            - name: BUILDKITE_AGENT_CONFIG
              value: /dev/null
            - name: BUILDKITE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "buildkite-agent-token"
                  key: "token"
            - name: BUILDKITE_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BUILDKITE_AGENT_TAGS
              value: "queue=docker,runtime=dind"
            - name: BUILDKITE_AGENT_HEALTH_CHECK_ADDR
              value: 0.0.0.0:8080
            - name: BUILDKITE_BUILD_PATH
              value: /buildkite/builds
            # The agent cannot check out plugins without a plugins path.
            - name: BUILDKITE_PLUGINS_PATH
              value: /buildkite/plugins
            - name: BUILDKITE_SOCKETS_PATH
              value: /buildkite/sockets
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: DOCKER_CONFIG
              value: /etc/buildkite-agent/docker
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /agent/1
              port: health
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
          resources:
            {}
          volumeMounts:
            - name: docker-run
              mountPath: /var/run
            - name: workspace
              mountPath: /buildkite
            - name: docker-config
              mountPath: /etc/buildkite-agent/docker
        - name: deletion-cost
          image: "python:3.12.14-alpine3.24@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111"
          imagePullPolicy: IfNotPresent
          # As PID 1, Python ignores SIGTERM until its handler is installed, so a
          # Pod removed during startup would wait out the full grace period.
          command:
            - /bin/sh
            - -c
            - trap 'exit 0' TERM; python3 -u /opt/deletion-cost/deletion_cost.py & wait $!
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: deletion-cost-code
              mountPath: /opt/deletion-cost
              readOnly: true
            - name: deletion-cost-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: deletion-cost-code
          configMap:
            name: buildkite-buildkite-operator-deletion-cost
        - name: deletion-cost-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: docker-data
          emptyDir:
            sizeLimit: 40Gi
        - name: docker-run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        # Docker client configuration for the Pod's lifetime, shared by every
        # job, so logins and buildx state persist across jobs.
        - name: docker-config
          emptyDir:
            sizeLimit: 16Mi

