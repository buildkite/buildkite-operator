          labelSelector:
            matchLabels:
              app.kubernetes.io/name: buildkite-operator
              app.kubernetes.io/instance: buildkite
              app.kubernetes.io/component: oci-accelerator
      # Covers the default 15 second accelerator drain and, with peering, a
      # second 15 second peer drain. Increase this if overriding the shutdown timeout.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
