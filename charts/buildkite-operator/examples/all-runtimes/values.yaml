# The README's runner pool examples in one release: every runtime, persistent
# and ephemeral agents, scale to zero, tokens from existing Secrets, image pull
# caching through two independent OCI accelerator replicas, which one pool
# opts out of, and step images, which another opts out of, and a composed
# agent runtime. Run `make helm-examples` after changing this file or the
# chart to update rendered.yaml and NOTES.txt.
agentToken:
  existingSecret:
    name: buildkite-agent-token

metricsToken:
  existingSecret:
    name: buildkite-metrics-token

ociAccelerator:
  enabled: true
  replicas: 2

runnerPools:
  linux:
    queue: linux
    ephemeralAgent: true
    maxReplicas: 10

  docker-builds:
    queue: docker-builds
    runtime: sysbox
    minReplicas: 0
    maxReplicas: 4
    docker:
      stepImages: false

  docker:
    queue: docker
    runtime: dind
    maxReplicas: 4

  untrusted:
    queue: untrusted
    runtime: kata
    ephemeralAgent: true
    maxReplicas: 6
    docker:
      ociAccelerator: false
      agentRuntimeImage: buildkite/agent-base:ubuntu-noble-hosted-toolchains
