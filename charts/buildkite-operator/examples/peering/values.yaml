# A three-replica OCI Accelerator fleet with DNS-seeded peering and an existing
# CA Secret. Each replica keeps an ephemeral cache, and the dind runner pool
# uses the same accelerator Service as a single-instance release. Run
# `make helm-examples` after changing this file or the chart to update
# rendered.yaml and NOTES.txt.
agentToken:
  existingSecret:
    name: buildkite-agent-token

metricsToken:
  existingSecret:
    name: buildkite-metrics-token

ociAccelerator:
  enabled: true
  replicas: 3
  peering:
    enabled: true
  ca:
    existingSecret:
      name: oci-accelerator-ca

runnerPools:
  docker:
    queue: docker
    runtime: dind
    maxReplicas: 4
