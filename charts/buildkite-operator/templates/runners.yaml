{{- if .Values.runners.enabled }}
{{- $queue := required "runners.queue is required when runners.enabled is true" .Values.runners.queue }}
{{- $maxReplicas := int .Values.runners.maxReplicas }}
{{- if lt $maxReplicas 1 }}
{{- fail "runners.maxReplicas must be at least 1 when runners.enabled is true" }}
{{- end }}
{{- if gt (int .Values.runners.minReplicas) $maxReplicas }}
{{- fail "runners.minReplicas must be less than or equal to runners.maxReplicas" }}
{{- end }}
{{- if and .Values.agentToken.value .Values.agentToken.existingSecret.name }}
{{- fail "set only one of agentToken.value or agentToken.existingSecret.name" }}
{{- end }}
{{- if and (not .Values.agentToken.value) (not .Values.agentToken.existingSecret.name) }}
{{- fail "agentToken.value or agentToken.existingSecret.name is required when runners.enabled is true" }}
{{- end }}
{{- $docker := or (eq .Values.runners.runtime "kata") (eq .Values.runners.runtime "sysbox") }}
{{- $singleUse := .Values.runners.singleUse }}
{{- if and $singleUse (not $docker) }}
{{- fail "runners.singleUse requires runners.runtime kata or sysbox, which provide a Docker daemon" }}
{{- end }}
{{- if and .Values.metricsToken.value .Values.metricsToken.existingSecret.name }}
{{- fail "set only one of metricsToken.value or metricsToken.existingSecret.name" }}
{{- end }}
{{- if and .Values.agentToken.existingSecret.name (not .Values.metricsToken.value) (not .Values.metricsToken.existingSecret.name) }}
{{- fail "metricsToken.value or metricsToken.existingSecret.name is required when using an existing agent token Secret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buildkite-operator.runnerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkite-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "buildkite-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "buildkite-operator.labels" . | nindent 8 }}
        app.kubernetes.io/component: runner
      annotations:
        {{- if .Values.agentToken.value }}
        # Roll agents when the chart-managed token changes; they read it at startup.
        checksum/agent-token: {{ .Values.agentToken.value | sha256sum }}
        {{- end }}
        # Treat agents as busy until the sidecar observes that they are idle.
        controller.kubernetes.io/pod-deletion-cost: "100"
        checksum/deletion-cost: {{ .Files.Get "files/deletion_cost.py" | sha256sum }}
        {{- if $singleUse }}
        checksum/supervisor: {{ .Files.Get "files/supervisor.sh" | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "buildkite-operator.deletionCostName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.runners.terminationGracePeriodSeconds }}
      {{- if eq .Values.runners.runtime "kata" }}
      runtimeClassName: kata-qemu-runtime-rs
      nodeSelector:
        experiments.buildkite.com/runtime: kata
      tolerations:
        - key: experiments.buildkite.com/runtime
          operator: Equal
          value: kata
          effect: NoSchedule
      {{- else if eq .Values.runners.runtime "sysbox" }}
      runtimeClassName: sysbox-runc
      hostUsers: false
      nodeSelector:
        experiments.buildkite.com/runtime: sysbox
      tolerations:
        - key: experiments.buildkite.com/runtime
          operator: Equal
          value: sysbox
          effect: NoSchedule
      {{- end }}
      {{- if $docker }}
      initContainers:
        - name: dockerd
          image: "{{ .Values.docker.image.repository }}:{{ .Values.docker.image.tag }}"
          imagePullPolicy: {{ .Values.docker.image.pullPolicy }}
          restartPolicy: Always
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            {{- if eq .Values.runners.runtime "sysbox" }}
            - --storage-driver=overlay2
            {{- end }}
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          securityContext:
            privileged: {{ eq .Values.runners.runtime "kata" }}
          startupProbe:
            exec:
              command: [docker, info]
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.docker.resources | nindent 12 }}
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
            - name: docker-run
              mountPath: /var/run
            - name: workspace
              mountPath: /buildkite
      {{- end }}
      containers:
        {{- if $singleUse }}
        - name: supervisor
          image: "{{ .Values.supervisor.image.repository }}:{{ .Values.supervisor.image.tag }}@{{ .Values.supervisor.image.digest }}"
          imagePullPolicy: {{ .Values.supervisor.image.pullPolicy }}
          command: ["/bin/sh", "/opt/supervisor/supervisor.sh"]
          env:
            - name: AGENT_IMAGE
              value: "{{ .Values.runners.image.repository }}:{{ .Values.runners.image.tag }}"
            - name: BUILDKITE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- include "buildkite-operator.agentTokenSecretRef" . | nindent 18 }}
            - name: AGENT_TAGS
              value: {{ printf "queue=%s,runtime=%s" $queue .Values.runners.runtime | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TERMINATION_GRACE_PERIOD_SECONDS
              value: {{ .Values.runners.terminationGracePeriodSeconds | quote }}
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /agent/1
              port: health
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.supervisor.resources | nindent 12 }}
          volumeMounts:
            - name: docker-run
              mountPath: /var/run
            - name: supervisor-script
              mountPath: /opt/supervisor
              readOnly: true
        {{- else }}
        - name: agent
          image: "{{ .Values.runners.image.repository }}:{{ .Values.runners.image.tag }}"
          imagePullPolicy: {{ .Values.runners.image.pullPolicy }}
          command: ["/usr/local/bin/buildkite-agent"]
          args: ["start"]
          env:
            - name: BUILDKITE_AGENT_CONFIG
              value: /dev/null
            - name: BUILDKITE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- include "buildkite-operator.agentTokenSecretRef" . | nindent 18 }}
            - name: BUILDKITE_AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BUILDKITE_AGENT_TAGS
              value: {{ printf "queue=%s,runtime=%s" $queue .Values.runners.runtime | quote }}
            - name: BUILDKITE_AGENT_HEALTH_CHECK_ADDR
              value: 0.0.0.0:8080
            - name: BUILDKITE_BUILD_PATH
              value: /buildkite/builds
            {{- if $docker }}
            - name: BUILDKITE_PLUGINS_PATH
              value: /buildkite/plugins
            - name: BUILDKITE_SOCKETS_PATH
              value: /buildkite/sockets
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            {{- end }}
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /agent/1
              port: health
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
          resources:
            {{- toYaml .Values.runners.resources | nindent 12 }}
          {{- if $docker }}
          volumeMounts:
            - name: docker-run
              mountPath: /var/run
            - name: workspace
              mountPath: /buildkite
          {{- end }}
        {{- end }}
        - name: deletion-cost
          image: "{{ .Values.deletionCost.image.repository }}:{{ .Values.deletionCost.image.tag }}@{{ .Values.deletionCost.image.digest }}"
          imagePullPolicy: {{ .Values.deletionCost.image.pullPolicy }}
          # As PID 1, Python ignores SIGTERM until its handler is installed, so a
          # Pod removed during startup would wait out the full grace period.
          command:
            - /bin/sh
            - -c
            - trap 'exit 0' TERM; python3 -u /opt/deletion-cost/deletion_cost.py & wait $!
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.deletionCost.resources | nindent 12 }}
          volumeMounts:
            - name: deletion-cost-code
              mountPath: /opt/deletion-cost
              readOnly: true
            - name: deletion-cost-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: deletion-cost-code
          configMap:
            name: {{ include "buildkite-operator.deletionCostName" . }}
        - name: deletion-cost-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- if $singleUse }}
        - name: supervisor-script
          configMap:
            name: {{ include "buildkite-operator.supervisorName" . }}
        {{- end }}
        {{- if $docker }}
        - name: docker-data
          emptyDir:
            sizeLimit: {{ .Values.docker.storage.data }}
        - name: docker-run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: workspace
          emptyDir:
            sizeLimit: {{ .Values.docker.storage.workspace }}
        {{- end }}
{{- end }}
