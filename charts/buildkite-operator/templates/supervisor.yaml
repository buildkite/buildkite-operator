{{- $ephemeralAgent := false }}
{{- range $entry := include "buildkite-operator.queueEntries" . | fromJsonArray }}{{ if $entry.settings.ephemeralAgent }}{{ $ephemeralAgent = true }}{{ end }}{{ end }}
{{- if $ephemeralAgent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "buildkite-operator.supervisorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkite-operator.labels" . | nindent 4 }}
data:
  supervisor.sh: |-
{{ .Files.Get "files/supervisor.sh" | indent 4 }}
{{- end }}
