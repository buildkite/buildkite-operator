{{- if and (include "buildkite-operator.queueEntries" . | fromJsonArray) .Values.registryCredentials.auths }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buildkite-operator.registryCredentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkite-operator.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "buildkite-operator.registryCredentialsConfig" . | b64enc }}
{{- /*
Hooks run before the Secret above exists on install, and after it is deleted on
uninstall, so the OCI accelerator CA hook Jobs pull with a copy that exists only
while the hooks run.
*/}}
{{- if and (include "buildkite-operator.ociAcceleratorUsed" .) (not .Values.ociAccelerator.ca.existingSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buildkite-operator.registryCredentialsHookSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkite-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "buildkite-operator.registryCredentialsConfig" . | b64enc }}
{{- end }}
{{- end }}
