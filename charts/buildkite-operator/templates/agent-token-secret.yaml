{{- if and .Values.runners.enabled (or .Values.agentToken.value .Values.metricsToken.value) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buildkite-operator.agentTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkite-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.agentToken.value }}
  token: {{ .Values.agentToken.value | quote }}
  {{- end }}
  authorization: {{ printf "Token %s" (default .Values.agentToken.value .Values.metricsToken.value) | quote }}
{{- end }}
