{{- if and .Values.runnerPool.enabled .Values.agentToken.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buildkite-operator.agentTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "buildkite-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.agentToken.existingSecret.key }}: {{ .Values.agentToken.value | quote }}
{{- end }}
