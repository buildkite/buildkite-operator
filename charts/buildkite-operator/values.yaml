# Settings shared by every runner pool. Any of these can be overridden per pool
# under runnerPools.<name>.
defaults:

  # standard, dind, kata or sysbox. See the README's "Runtimes".
  # - standard: the agent alone, with no Docker daemon.
  # - dind: adds a privileged Docker daemon, on any node. The namespace must
  #   allow privileged Pods (Pod Security Admission level privileged).
  #   WARNING: privileged containers have host-level access to their node, so
  #   dind isn't isolation. Only run trusted jobs.
  # - kata: adds a Docker daemon, privileged inside a VM. Needs RuntimeClass
  #   kata-qemu-runtime-rs, KVM-capable nodes and, like dind, a namespace that
  #   allows privileged Pods.
  # - sysbox: adds an unprivileged Docker daemon. Needs RuntimeClass
  #   sysbox-runc and nodes that support Kubernetes user namespaces.
  # dind, kata and sysbox run the daemon as a native sidecar, which needs
  # Kubernetes 1.29 or later. The chart doesn't install kata or sysbox. Label
  # and taint (NoSchedule) their nodes with
  # experiments.buildkite.com/runtime=<runtime>, and make their installers
  # select and tolerate those nodes.
  runtime: standard

  # Whether each runner's agent is replaced after every job. Runner Pods
  # persist either way, and only autoscaling adds or removes them.
  # - false: one agent runs job after job. Files, processes and, with dind,
  #   kata or sysbox, Docker containers, networks and volumes carry over.
  #   Reused checkouts make builds start faster.
  # - true: after each job, a new agent named <pod>-<suffix> registers with a
  #   clean workspace. What else resets depends on runtime:
  #   - standard: only the agent process restarts, and the build and plugin
  #     directories are emptied. /tmp, the home directory, installed packages
  #     and leftover processes persist.
  #   - dind, kata, sysbox: each agent is a fresh container, and the job's
  #     containers, networks, volumes and /buildkite workspace are removed.
  #     The daemon's image and build caches and DOCKER_CONFIG (including
  #     registry logins) persist.
  # Ephemeral agents aren't a security boundary between jobs. See the README's
  # "Ephemeral agents".
  ephemeralAgent: false

  minReplicas: 1
  pollingInterval: 10

  # Seconds the queue must be idle before KEDA scales a pool with
  # minReplicas 0 to zero. KEDA then removes every runner at once, ignoring
  # scaleDownStabilizationWindowSeconds. Raise it to keep idle pools longer.
  cooldownPeriod: 60

  # Seconds a lower job count must last before the HPA removes runners, except
  # when scaling to zero. Absorbs short dips between dependent steps. 0 to 3600.
  scaleDownStabilizationWindowSeconds: 60

  # Longest time an agent may take to drain its job once a runner is removed.
  terminationGracePeriodSeconds: 3600

  # Separate so you can override only the tag, such as
  # --set defaults.image.tag=4.2.0. Needs /bin/sh, except for persistent
  # standard agents.
  image:
    repository: buildkite/agent
    tag: "4"
    pullPolicy: Always

  # Agent container requests and limits. Ephemeral dind, kata and sysbox
  # agents run inside the Docker daemon and share docker.resources instead.
  resources: {}

  # Docker daemon for dind, kata and sysbox. Its resources also bound
  # ephemeral agents' containers.
  docker:
    image:
      repository: docker
      tag: 29.7.2-dind
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 15Gi
      limits:
        cpu: "4"
        memory: 8Gi
        ephemeral-storage: 50Gi
    storage:
      data: 40Gi
      workspace: 10Gi

    # Pull through the accelerator when ociAccelerator.enabled is true. Set
    # false to pull directly.
    ociAccelerator: true

    # Run each job entirely in its step's image:, including checkout, hooks
    # and plugins. The image needs git, bash (or your BUILDKITE_SHELL) and the
    # tools its hooks and plugins use. Set false to run every step in the agent
    # container, ignoring image:. See the README's "Step images".
    stepImages: true

    # Image for steps without image:. Requires stepImages, and standard
    # runners ignore it.
    defaultStepImage: ""

    # Image to run ephemeral dind, kata and sysbox agents in. Rejected for other
    # pools. The agent binary still comes from image. docker.image must be
    # Docker 29+, and the chart switches it to the containerd image store. See
    # the README's "Agent runtime image".
    agentRuntimeImage: ""

# One runner pool per Buildkite queue. Each pool is a KEDA-autoscaled
# Deployment named <release>-<name>, with Pods labelled
# buildkite.com/runner-pool=<name>. Set queue and maxReplicas. Everything else
# comes from defaults. Each queue can appear in only one pool.
#
# Examples (the README's "Runner pools" section explains each):
#
# runnerPools:
#   # Ephemeral standard agents: a fresh agent and empty workspace for every
#   # job in a plain Pod with no Docker daemon. The container keeps running,
#   # so files outside the workspace carry over between jobs.
#   linux:
#     queue: linux
#     ephemeralAgent: true
#     maxReplicas: 10
#
#   # Persistent sysbox agents: one long-lived agent per Pod alongside an
#   # unprivileged Docker daemon. Containers, volumes and caches carry over
#   # between jobs. Scales to zero when the queue is idle.
#   docker-builds:
#     queue: docker-builds
#     runtime: sysbox
#     minReplicas: 0
#     maxReplicas: 4
#
#   # Persistent dind agents for trusted jobs on clusters that can't run kata
#   # or sysbox: one long-lived agent per Pod next to a privileged Docker
#   # daemon, on any node.
#   docker:
#     queue: docker
#     runtime: dind
#     maxReplicas: 4
#
#   # Ephemeral kata agents: each job runs in a fresh agent container inside a
#   # VM-isolated Pod. Afterwards the job's containers, networks, volumes and
#   # workspace are removed. Docker's image and build caches are kept.
#   untrusted:
#     queue: untrusted
#     runtime: kata
#     ephemeralAgent: true
#     maxReplicas: 6
#
# To turn a pool off, delete or comment out its entry, or set it to null with
# --set runnerPools.<name>=null or in a later values file:
#
# runnerPools:
#   untrusted: null
#
# Its agents drain their jobs and its Deployment is removed. To keep a pool
# with no idle runners, set minReplicas: 0. maxReplicas must be at least 1.
runnerPools: {}

# Image and resources for dind, kata and sysbox runners' helper containers: the
# supervisor that starts ephemeral agents, and the init container that copies
# registryCredentials into the Docker client config. Digest pins the
# multi-platform index.
supervisor:
  image:
    repository: docker
    tag: 29.7.2-cli
    digest: sha256:3f4743208d2338c934d7b8bcfbe1bb54c0b2355c510ad5e0f31c0c4a54bd704e
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Always on. A sidecar gives Pods whose agent is busy or unknown
# pod-deletion-cost 100, and clears it when idle, so scale-in prefers removing
# idle runners. This is best-effort. Its image and resources also run the OCI
# Accelerator CA hook Jobs. Digest pins the multi-platform index.
deletionCost:

  # Limits the sidecar, whose RBAC can patch any Pod in the namespace, to the
  # two scale-in annotations on its own Pod. Creates a cluster-scoped
  # ValidatingAdmissionPolicy and binding named
  # <namespace>-<release>-buildkite-operator-deletion-cost, which needs
  # Kubernetes 1.30 or later. Disable only if you can't create those. Without
  # it, a job that escapes to its node can use the sidecar's token to change
  # any Pod in the namespace, including its image.
  admissionPolicy:
    enabled: true

  image:
    repository: python
    tag: 3.12.14-alpine3.24
    digest: sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# OCI Accelerator (https://github.com/buildkite/oci-accelerator) caches image
# pulls on its nodes' disks for dind, kata and sysbox pools with
# docker.ociAccelerator. Their Docker daemons send all HTTPS traffic through
# it, so their pulls fail while it's unavailable.
ociAccelerator:
  enabled: false

  # A StatefulSet behind a Service. Use two or more replicas to stay available
  # during rolling updates, which don't surge. Cache size and resources are per
  # replica. Without peering, each fills its own cache from origin.
  replicas: 1

  # Replicas find each other through the headless Service and fetch cached
  # content from one another. Changing this restarts every replica with an
  # empty cache. Requires 32 replicas or fewer.
  peering:
    enabled: false

  # Registries whose digest-addressed manifests and blobs are cached, as host
  # or host:port. Use registry-1.docker.io for Docker Hub. Traffic to other
  # hosts passes through the accelerator uncached.
  registries:
    - registry-1.docker.io
    - ghcr.io
    - public.ecr.aws

  # Hosts the Docker daemons reach directly instead of through the accelerator,
  # such as private registries it cannot reach. Must not include registries.
  noProxy: []

  # Root CA the accelerator signs registry certificates with, held in a Secret
  # only the accelerator references. By default, a hook generates it into a
  # <release>-...-oci-accelerator-ca Secret if none exists, and deletes it on
  # uninstall. To bring your own, set existingSecret.name to a Secret in the
  # release namespace with both keys, which the chart only reads. See
  # docs/appendices.md.
  ca:
    existingSecret:
      name: ""
      certificateKey: ca.crt
      privateKeyKey: ca.key

  # An emptyDir on the accelerator's node. It outlives runner Pods but empties
  # whenever the accelerator Pod is replaced, such as when an upgrade changes
  # it or its node is removed.
  cache:

    # The emptyDir's size limit, also requested as ephemeral-storage unless
    # resources.requests sets it. The node needs this much free disk on top of
    # its runners'.
    size: 20Gi

    # Bytes the cache may use, including 4 KiB metadata per entry. Keep it
    # below size to leave room for filesystem overhead.
    maxBytes: 19327352832

  # Extra OCI_ACCELERATOR_* settings, such as OCI_ACCELERATOR_CACHE_MAX_FILLS:
  # "32". You can't set ones the chart manages: registries, listeners,
  # metrics, the CA and cache directories, maxBytes and peering.
  #
  # Tags, tag lists, referrers and catalogs are cached in memory for 30
  # seconds, so a newly pushed or moved tag can resolve to its old digest. Set
  # OCI_ACCELERATOR_CACHE_MUTABLE_TTL: "0s" to disable this, or
  # OCI_ACCELERATOR_CACHE_MUTABLE_SHARED: "false" for registries whose
  # listings differ by token.
  extraEnv: {}

  # Admit accelerator connections only from this release's runner Pods.
  # Requires a network plugin that enforces NetworkPolicy.
  networkPolicy:
    enabled: true

  nodeSelector: {}
  tolerations: []

  # Digest pins the multi-platform index.
  image:
    repository: buildkite/oci-accelerator
    tag: v0.5.0
    digest: sha256:c671b75f349cf625fdd7555c632f17782d6b98ed7c21bc5fa8bdcf6426ab0578
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi

agentToken:
  value: ""
  existingSecret:
    name: ""
    key: token

# The metrics API needs an Authorization value, "Token <token>". By default
# it's agentToken.value with the prefix added. With agentToken.existingSecret,
# set a metrics token or reference a Secret key holding the full value.
metricsToken:
  value: ""
  existingSecret:
    name: ""
    key: authorization

# Registry credentials. Every Pod in the release uses them as
# imagePullSecrets. dind, kata and sysbox runners also add them to the Docker
# client config (DOCKER_CONFIG) for the Pod's lifetime, so jobs' pulls, runs
# and builds are authenticated. Any job can read them.
registryCredentials:

  # Creates one kubernetes.io/dockerconfigjson Secret, and Helm stores the
  # values in its release Secret. Use an access token, not a password, and
  # https://index.docker.io/v1/ for Docker Hub.
  auths: []
  #  - registry: https://index.docker.io/v1/
  #    username: myuser
  #    password: dckr_pat_...
  #  - registry: ghcr.io
  #    username: myorg
  #    password: ghp_...

  # Or name an existing kubernetes.io/dockerconfigjson Secret in the release
  # namespace, such as from kubectl create secret docker-registry. The chart
  # never creates or deletes it.
  existingSecret:
    name: ""

# KEDA 2.20.0 must be installed separately, watching this release's namespace.
# Disable validation only to render or lint offline, where Helm can't discover
# the cluster's APIs.
keda:
  validateInstallation: true
