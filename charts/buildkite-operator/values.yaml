# Settings shared by every queue entry. Any of these can be overridden per entry
# under queues.<name>.
defaults:
  # standard, dind, kata, or sysbox (see the README's "Runner isolation").
  # - standard: the agent alone, with no Docker daemon.
  # - dind: the agent plus a privileged Docker daemon on any node. Nothing to
  #   install, but the namespace must allow privileged Pods (Pod Security
  #   Admission level privileged). WARNING: a privileged container has
  #   host-level access to its node, so this is not isolation; only run
  #   trusted jobs.
  # kata and sysbox run a Docker daemon with stronger isolation, but need
  # cluster components that this chart does not install:
  # - kata: RuntimeClass kata-qemu-runtime-rs (for example from the kata-deploy
  #   Helm chart) and KVM-capable nodes labelled and tainted (NoSchedule)
  #   experiments.buildkite.com/runtime=kata.
  # - sysbox: RuntimeClass sysbox-runc (from sysbox-deploy-k8s) and nodes that
  #   support Kubernetes user namespaces, labelled and tainted (NoSchedule)
  #   experiments.buildkite.com/runtime=sysbox.
  # Each installer must also select and tolerate those nodes; see the README.
  runtime: standard
  # Whether each runner's Buildkite agent is ephemeral. This is about the
  # agent, not the Pod: runner Pods always persist across jobs, and only
  # autoscaling adds or removes them.
  # - false (persistent): one agent registers when the Pod starts and runs job
  #   after job. Whatever a job leaves behind (files, processes and, with kata
  #   or sysbox, Docker containers, networks and volumes) is still there for
  #   the next job. Checkouts are reused, so builds start faster.
  # - true (ephemeral): the agent disconnects after one job and is replaced by
  #   a newly registered agent, named <pod>-<suffix>, with a clean workspace.
  #   What else is reset depends on runtime:
  #   - standard: a loop in the agent container restarts the agent process
  #     and empties the build and plugin directories under /buildkite. The
  #     container is not restarted, so everything else in its filesystem
  #     (such as /tmp, the home directory and installed packages) and any
  #     processes a job left running persist. The image needs /bin/sh.
  #   - dind, kata, sysbox: a supervisor starts each agent as a fresh
  #     container in the Pod's Docker daemon and, between jobs, removes the
  #     job's containers, networks, volumes and the /buildkite workspace.
  #     The daemon and its image and build caches persist, as does the Docker
  #     client configuration (DOCKER_CONFIG, including registry logins).
  # Ephemeral agents keep successive jobs' state apart; they are not a security
  # boundary between jobs. See the README's "Ephemeral agents".
  ephemeralAgent: false
  minReplicas: 1
  pollingInterval: 10
  # Seconds the queue must be fully idle before KEDA scales a queue with
  # minReplicas 0 to zero. KEDA removes every remaining runner at once, without
  # waiting for scaleDownStabilizationWindowSeconds; raise this to keep an idle
  # pool longer.
  cooldownPeriod: 60
  # Seconds the HPA waits for lower job counts to persist before removing
  # runners while at least one is still needed, so short dips between dependent
  # steps do not recreate them. 0 to 3600.
  scaleDownStabilizationWindowSeconds: 60
  # Longest time an agent may take to drain its job once a runner is removed.
  terminationGracePeriodSeconds: 3600
  # repository and tag are separate so an override can set only the tag, for
  # example --set defaults.image.tag=4.2.0.
  image:
    repository: buildkite/agent
    tag: "4"
    pullPolicy: Always
  # Requests and limits for the agent container. Ignored with dind, kata or
  # sysbox and ephemeralAgent, where agents run as containers inside the
  # Docker daemon and share docker.resources.
  resources: {}
  # Docker daemon used by the dind, kata and sysbox runtimes. With
  # ephemeralAgent, its resources also bound the agent containers it runs.
  docker:
    image:
      repository: docker
      tag: 29.7.2-dind
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 15Gi
      limits:
        cpu: "4"
        memory: 8Gi
        ephemeral-storage: 50Gi
    storage:
      data: 40Gi
      workspace: 10Gi
    # Pull images through the release's OCI accelerator when
    # ociAccelerator.enabled is true. Set false on an entry to pull directly.
    ociAccelerator: true
    # Run the whole job in its image:, including plugin/repository checkout,
    # hooks and commands, using the shared agent binary. The image needs git,
    # bash (the default BUILDKITE_SHELL) and the tools its hooks/plugins use.
    # Set false to run every step in the agent container, ignoring image:.
    # See the README's "Step images".
    stepImages: true
    # Optional whole-job image for steps without image:. An explicit nonempty
    # image: wins. Requires stepImages; ignored by standard runners.
    defaultStepImage: ""
    # Optional runtime for supervised ephemeral Docker agents. The agent binary
    # still comes from image, mounted read-only into this runtime, then copied
    # to the shared workspace for Docker/Compose plugins and step containers.
    # Requires Docker 29+ with the containerd image store. See the README.
    agentRuntimeImage: ""

# One entry per Buildkite queue, keyed by a short name used in resource names
# (<release>-<name>). Each entry becomes a runner pool: a Deployment of runner
# Pods labelled buildkite.com/runner-pool=<name>, autoscaled by KEDA. Each
# entry needs a queue and maxReplicas, and inherits everything else from
# defaults. Each Buildkite queue may appear only once.
#
# Examples (the README's "Queues" section explains each):
#
# queues:
#   # Ephemeral standard agents: a fresh agent and empty workspace for every
#   # job in a plain Pod with no Docker daemon. The container keeps running,
#   # so files outside the workspace carry over between jobs.
#   linux:
#     queue: linux
#     ephemeralAgent: true
#     maxReplicas: 10
#
#   # Persistent sysbox agents: one long-lived agent per Pod alongside an
#   # unprivileged Docker daemon. Containers, volumes and caches carry over
#   # between jobs. Scales to zero when the queue is idle.
#   docker-builds:
#     queue: docker-builds
#     runtime: sysbox
#     minReplicas: 0
#     maxReplicas: 4
#
#   # Persistent dind agents for trusted jobs on clusters that can't run kata
#   # or sysbox: one long-lived agent per Pod next to a privileged Docker
#   # daemon, on any node.
#   docker:
#     queue: docker
#     runtime: dind
#     maxReplicas: 4
#
#   # Ephemeral kata agents: each job runs in a fresh agent container inside a
#   # VM-isolated Pod. Afterwards the job's containers, networks, volumes and
#   # workspace are removed; Docker's image and build caches are kept.
#   untrusted:
#     queue: untrusted
#     runtime: kata
#     ephemeralAgent: true
#     maxReplicas: 6
#
# To turn a pool off, comment out or delete its entry, or set it to null with
# --set queues.<name>=null or in a later values file, for example
# `helm upgrade ... -f values.yaml -f off.yaml` with off.yaml containing:
#
# queues:
#   untrusted: null
#
# The pool's Deployment is then removed and its agents drain their current
# jobs. maxReplicas must be at least 1; to keep a pool without idle runners,
# set minReplicas: 0 instead.
queues: {}

# Starts and replaces ephemeral agent containers in the Docker daemon. Used only
# by dind, kata and sysbox queue entries with ephemeralAgent. The digest pins
# the multi-platform image index.
supervisor:
  image:
    repository: docker
    tag: 29.7.2-cli
    digest: sha256:3f4743208d2338c934d7b8bcfbe1bb54c0b2355c510ad5e0f31c0c4a54bd704e
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Always-on scale-in preference: a sidecar marks busy or unknown agents with
# pod-deletion-cost 100 and removes the annotation from idle agents. It needs
# permission to patch Pods in the release namespace. The digest pins the
# multi-platform image index for the tag. The image and resources are also used
# by the OCI accelerator CA hook Jobs.
deletionCost:
  # RBAC lets the sidecar patch any Pod in the release namespace. A
  # ValidatingAdmissionPolicy and binding, which are cluster-scoped and named
  # <namespace>-<release>-buildkite-operator-deletion-cost, limit it to the two
  # scale-in annotations on its own Pod. Installing them needs permission to
  # create those cluster-scoped resources. Disable only if you can't grant
  # that; then anyone with a sidecar's token, such as a job that escapes to its
  # node, can change any Pod in the namespace, including its image.
  admissionPolicy:
    enabled: true
  image:
    repository: python
    tag: 3.12.14-alpine3.24
    digest: sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Caching HTTPS proxy for image pulls by the dind, kata and sysbox Docker
# daemons (https://github.com/buildkite/oci-accelerator). One instance per release
# caches registry content on its node's disk and serves every queue entry with
# docker.ociAccelerator enabled. Each daemon sends all of its HTTPS traffic
# through the proxy, so pulls fail while the proxy is unavailable.
ociAccelerator:
  enabled: false
  # Registries whose digest-addressed manifests and blobs are cached, as host
  # or host:port. Use registry-1.docker.io for Docker Hub. Traffic to other
  # hosts passes through the proxy uncached.
  registries:
    - registry-1.docker.io
    - ghcr.io
    - public.ecr.aws
  # Hosts the Docker daemons reach directly instead of through the proxy, such
  # as private registries the proxy cannot reach. Must not include registries.
  noProxy: []
  # Root CA the proxy signs registry certificates with, held in a Secret only
  # the proxy references. Before install and every upgrade, a hook Job copies the
  # certificate into a <release>-...-oci-accelerator-ca-cert ConfigMap for runner
  # Docker daemons. With no existingSecret.name, it first generates the CA with
  # "oci-accelerator init-ca" into a <release>-...-oci-accelerator-ca Secret if
  # none exists. Hooks delete the ConfigMap, and any generated Secret, on
  # uninstall. To provide your own, set existingSecret.name to a Secret in the
  # release namespace holding both files (see the README); the chart only reads it.
  ca:
    existingSecret:
      name: ""
      certificateKey: ca.crt
      privateKeyKey: ca.key
  # The cache is an emptyDir on the proxy's node, so it outlives runner Pods
  # but starts empty whenever the proxy Pod is replaced, such as on upgrades
  # that change it or when its node is removed.
  cache:
    # The emptyDir's size limit. The proxy also requests this much
    # ephemeral-storage unless resources.requests sets it, so it needs a node
    # with this much free disk alongside the runners there.
    size: 20Gi
    # Bytes the cache may use, including 4 KiB metadata per entry. Keep it
    # below size to leave room for filesystem overhead.
    maxBytes: 19327352832
  # Additional OCI_ACCELERATOR_* settings, such as
  # OCI_ACCELERATOR_CACHE_MAX_FILLS: "32". Settings the chart manages
  # (registries, listeners, state directories, maxBytes and peering) cannot be
  # set here.
  #
  # The proxy also keeps tag manifests, tag lists, referrer lists and catalog
  # responses in memory for 30 seconds, so a tag pushed or moved during that
  # time can still resolve to its previous digest. Set
  # OCI_ACCELERATOR_CACHE_MUTABLE_TTL: "0s" to disable this, or
  # OCI_ACCELERATOR_CACHE_MUTABLE_SHARED: "false" for registries whose tag or
  # referrer listings differ by token.
  extraEnv: {}
  # Admit proxy connections only from this release's runner Pods. Requires a
  # network plugin that enforces NetworkPolicy.
  networkPolicy:
    enabled: true
  nodeSelector: {}
  tolerations: []
  # The digest pins the multi-platform image index for the tag.
  image:
    repository: buildkite/oci-accelerator
    tag: v0.3.0
    digest: sha256:4278099ee0e250ed3648afbedd9cfe9242fda6e81ea6f5196f7e598754f21641
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi

agentToken:
  value: ""
  existingSecret:
    name: ""
    key: token

# The metrics API uses an Authorization value in the form "Token <token>".
# When agentToken.value is set, it is reused and prefixed automatically. With
# an existing agent Secret, provide a metrics token or reference a Secret whose
# key already contains the complete Authorization value.
metricsToken:
  value: ""
  existingSecret:
    name: ""
    key: authorization

# Registry credentials for every Pod the release runs, and for the docker CLI
# in dind, kata and sysbox runners. The kubelet uses them as imagePullSecrets
# to pull the chart's own images. Runners with a Docker daemon also copy them
# into the Docker client configuration (DOCKER_CONFIG) that jobs and ephemeral
# agents share for the Pod's lifetime, so image pulls, runs and builds in jobs
# are authenticated; standard runners get only imagePullSecrets. Any job can
# read them.
registryCredentials:
  # The chart creates one kubernetes.io/dockerconfigjson Secret from these.
  # Use https://index.docker.io/v1/ as the registry for Docker Hub, and an
  # access token rather than an account password. Values set here are stored
  # in Helm's release Secret.
  auths: []
  #  - registry: https://index.docker.io/v1/
  #    username: myuser
  #    password: dckr_pat_...
  #  - registry: ghcr.io
  #    username: myorg
  #    password: ghp_...
  # Or name an existing kubernetes.io/dockerconfigjson Secret in the release
  # namespace, such as one from kubectl create secret docker-registry. The
  # chart never creates or deletes it.
  existingSecret:
    name: ""

# KEDA 2.20.0 must be installed separately and configured to watch this release
# namespace. Disable validation only for offline rendering and linting, where
# Helm cannot discover APIs from a cluster.
keda:
  validateInstallation: true
