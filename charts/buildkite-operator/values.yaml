runners:
  enabled: true
  name: ""
  queue: ""
  # standard, kata, or sysbox. Kata and Sysbox require their RuntimeClass and
  # compatible, labelled nodes to be installed before this chart is installed.
  runtime: standard
  minReplicas: 1
  maxReplicas: 0
  pollingInterval: 10
  cooldownPeriod: 60
  terminationGracePeriodSeconds: 3600
  image:
    repository: buildkite/agent
    tag: "4"
    pullPolicy: Always
  resources: {}

docker:
  image:
    repository: docker
    tag: 29.7.2-dind
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 15Gi
    limits:
      cpu: "4"
      memory: 8Gi
      ephemeral-storage: 50Gi
  storage:
    data: 40Gi
    workspace: 10Gi

agentToken:
  value: ""
  existingSecret:
    name: ""
    key: token

# The metrics API uses an Authorization value in the form "Token <token>".
# When agentToken.value is set, it is reused and prefixed automatically. With
# an existing agent Secret, provide a metrics token or reference a Secret whose
# key already contains the complete Authorization value.
metricsToken:
  value: ""
  existingSecret:
    name: ""
    key: authorization

# KEDA 2.20.0 must be installed separately and configured to watch this release
# namespace. Disable validation only for offline rendering and linting, where
# Helm cannot discover APIs from a cluster.
keda:
  validateInstallation: true
