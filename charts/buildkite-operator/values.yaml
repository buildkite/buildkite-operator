runners:
  enabled: true
  name: ""
  queue: ""
  # standard, kata, or sysbox. Kata and Sysbox require their RuntimeClass and
  # compatible, labelled nodes to be installed before this chart is installed.
  runtime: standard
  minReplicas: 1
  maxReplicas: 0
  pollingInterval: 10
  cooldownPeriod: 60
  terminationGracePeriodSeconds: 3600
  image:
    repository: buildkite/agent
    tag: "4"
    pullPolicy: Always
  resources: {}

docker:
  image:
    repository: docker
    tag: 29.7.2-dind
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 15Gi
    limits:
      cpu: "4"
      memory: 8Gi
      ephemeral-storage: 50Gi
  storage:
    data: 40Gi
    workspace: 10Gi

agentToken:
  value: ""
  existingSecret:
    name: ""
    key: token

# The metrics API uses an Authorization value in the form "Token <token>".
# When agentToken.value is set, it is reused and prefixed automatically. With
# an existing agent Secret, provide a metrics token or reference a Secret whose
# key already contains the complete Authorization value.
metricsToken:
  value: ""
  existingSecret:
    name: ""
    key: authorization

kedaCleanup:
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.36.1
    pullPolicy: IfNotPresent

# KEDA is vendored and installed by default so this chart is standalone. Set
# enabled=false only when a compatible KEDA installation already watches this
# release namespace.
keda:
  enabled: true
  crds:
    # KEDA's CRDs are copied into this parent chart's crds/ directory so Helm
    # installs them before validating the chart's ScaledObject.
    install: false
