# A RunnerPool for the e2e suite, in its own namespace so it is unaffected by
# the restricted pod security policy enforced on the manager's namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: buildkite-operator-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: buildkite-agent-token
  namespace: buildkite-operator-e2e
stringData:
  token: not-a-real-agent-token
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-http
  namespace: buildkite-operator-e2e
spec:
  selector:
    app: e2e-http
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-http
  namespace: buildkite-operator-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-http
  template:
    metadata:
      labels:
        app: e2e-http
    spec:
      containers:
        - name: http
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
---
apiVersion: buildkite.com/v1alpha1
kind: RunnerPool
metadata:
  name: e2e-pool
  namespace: buildkite-operator-e2e
spec:
  queue: e2e
  maxRunners: 2
  minIdleRunners: 1
  idleTimeoutSeconds: 10
  terminationGracePeriodSeconds: 30
  # pause supplies a long-running public fixture for the inner agent without
  # contacting Buildkite. Autoscaling health behavior remains covered by
  # controller tests because pause does not implement the agent endpoints.
  agentImage: registry.k8s.io/pause:3.10
  agentTokenSecretRef:
    name: buildkite-agent-token
    key: token
