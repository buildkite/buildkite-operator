# A RunnerPool for the e2e suite, in its own namespace so it is unaffected by
# the restricted pod security policy enforced on the manager's namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: buildkite-operator-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: buildkite-agent-token
  namespace: buildkite-operator-e2e
stringData:
  token: not-a-real-agent-token
---
apiVersion: v1
kind: Secret
metadata:
  name: e2e-cache-rpc
  namespace: buildkite-operator-e2e
immutable: true
stringData:
  rpc-secret: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
---
apiVersion: v1
kind: Secret
metadata:
  name: e2e-cache-credentials
  namespace: buildkite-operator-e2e
immutable: true
stringData:
  access-key-id: GK0123456789abcdef0123456789abcdef
  secret-access-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
---
apiVersion: buildkite.com/v1alpha1
kind: CacheStore
metadata:
  name: e2e-cache
  namespace: buildkite-operator-e2e
spec:
  rpcSecretRef:
    name: e2e-cache-rpc
    key: rpc-secret
  credentialsSecretRef:
    name: e2e-cache-credentials
    accessKeyIDKey: access-key-id
    secretAccessKeyKey: secret-access-key
  storage:
    size: 1Gi
  retentionDays: 2
---
apiVersion: buildkite.com/v1alpha1
kind: RunnerPool
metadata:
  name: e2e-pool
  namespace: buildkite-operator-e2e
spec:
  queue: e2e
  maxRunners: 2
  minIdleRunners: 1
  idleTimeoutSeconds: 10
  terminationGracePeriodSeconds: 5
  # This fixture verifies Pod ownership and lifecycle without contacting
  # Buildkite. The pause image does not implement the agent health endpoints,
  # so autoscaling status behavior remains covered by controller tests.
  image: registry.k8s.io/pause:3.10
  agentTokenSecretRef:
    name: buildkite-agent-token
    key: token
  cacheStoreRef:
    name: e2e-cache
