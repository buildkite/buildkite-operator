# A RunnerPool for the e2e suite, in its own namespace so it is unaffected by
# the restricted pod security policy enforced on the manager's namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: buildkite-operator-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: buildkite-agent-token
  namespace: buildkite-operator-e2e
stringData:
  token: not-a-real-agent-token
---
apiVersion: buildkite.com/v1alpha1
kind: RunnerPool
metadata:
  name: e2e-pool
  namespace: buildkite-operator-e2e
spec:
  queue: e2e
  maxRunners: 2
  minIdleRunners: 1
  idleTimeoutSeconds: 10
  terminationGracePeriodSeconds: 5
  # This fixture verifies Pod ownership and lifecycle without contacting
  # Buildkite. The pause image does not implement the agent health endpoints,
  # so autoscaling status behavior remains covered by controller tests.
  image: registry.k8s.io/pause:3.10
  agentTokenSecretRef:
    name: buildkite-agent-token
    key: token
