{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: cachestores.buildkite.com
spec:
  group: buildkite.com
  names:
    kind: CacheStore
    listKind: CacheStoreList
    plural: cachestores
    singular: cachestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.bucket
      name: Bucket
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CacheStore is the Schema for the cachestores API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CacheStore
            properties:
              bucket:
                default: buildkite-cache
                description: bucket is the S3 bucket used for Buildkite cache objects.
                maxLength: 63
                minLength: 3
                pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                type: string
                x-kubernetes-validations:
                - message: bucket must not contain adjacent periods
                  rule: '!self.contains(''..'')'
                - message: bucket must not be formatted as an IP address
                  rule: '!self.matches(''^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$'')'
                - message: bucket uses a reserved prefix
                  rule: '!self.startsWith(''xn--'') && !self.startsWith(''sthree-'')
                    && !self.startsWith(''amzn_s3_demo_'')'
                - message: bucket uses a reserved suffix
                  rule: '!self.endsWith(''-s3alias'') && !self.endsWith(''--ol-s3'')
                    && !self.endsWith(''.mrap'') && !self.endsWith(''--x-s3'') &&
                    !self.endsWith(''--table-s3'')'
                - message: bucket is immutable
                  rule: self == oldSelf
              credentialsSecretRef:
                description: credentialsSecretRef selects Garage's S3 credentials.
                properties:
                  accessKeyIDKey:
                    description: accessKeyIDKey is the key containing the S3 access-key
                      ID.
                    minLength: 1
                    type: string
                  name:
                    description: name is the name of an immutable Secret in the CacheStore's
                      namespace.
                    minLength: 1
                    type: string
                  secretAccessKeyKey:
                    description: secretAccessKeyKey is the key containing the S3 secret
                      access key.
                    minLength: 1
                    type: string
                required:
                - accessKeyIDKey
                - name
                - secretAccessKeyKey
                type: object
                x-kubernetes-validations:
                - message: credentialsSecretRef is immutable
                  rule: self == oldSelf
              image:
                default: dxflrs/garage:v2.3.0
                description: image is the Garage container image.
                minLength: 1
                type: string
              lifecycleImage:
                default: public.ecr.aws/aws-cli/aws-cli:2.27.41
                description: lifecycleImage is the AWS CLI image used to apply the
                  bucket lifecycle rule.
                minLength: 1
                type: string
              resources:
                description: resources are the compute resources for the Garage container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
                x-kubernetes-validations:
                - message: resources.claims is not supported
                  rule: '!has(self.claims)'
              retentionDays:
                default: 2
                description: |-
                  retentionDays is the number of day boundaries after which Garage expires
                  cache objects. Restoring an object refreshes its modification time.
                format: int32
                minimum: 1
                type: integer
              rpcSecretRef:
                description: rpcSecretRef selects Garage's RPC secret.
                properties:
                  key:
                    description: key is the key in the Secret containing a 64-character
                      hexadecimal value.
                    minLength: 1
                    type: string
                  name:
                    description: name is the name of an immutable Secret in the CacheStore's
                      namespace.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
                x-kubernetes-validations:
                - message: rpcSecretRef is immutable
                  rule: self == oldSelf
              storage:
                description: storage configures Garage's persistent volume.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: size is the requested capacity of the ReadWriteOnce
                      persistent volume.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: size must be greater than zero
                      rule: quantity(self).isGreaterThan(quantity('0'))
                  storageClassName:
                    description: |-
                      storageClassName selects the StorageClass for the persistent volume claim.
                      When omitted, the cluster's default StorageClass is used.
                    type: string
                required:
                - size
                type: object
                x-kubernetes-validations:
                - message: storage is immutable
                  rule: self == oldSelf
            required:
            - credentialsSecretRef
            - rpcSecretRef
            - storage
            type: object
          status:
            description: status defines the observed state of CacheStore
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the CacheStore resource.

                  Condition types used by this controller:
                  - "Ready": Garage is available and its lifecycle rule is configured

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the .metadata.generation this status
                  was computed from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a valid Service name no more than 63 characters
          rule: size(self.metadata.name) <= 63 && self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
