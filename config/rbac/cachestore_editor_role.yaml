# This rule is not used by the project buildkite-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the buildkite.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/managed-by: kustomize
  name: cachestore-editor-role
rules:
- apiGroups:
  - buildkite.com
  resources:
  - cachestores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - buildkite.com
  resources:
  - cachestores/status
  verbs:
  - get
