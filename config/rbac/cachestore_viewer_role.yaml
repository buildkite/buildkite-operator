# This rule is not used by the project buildkite-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to buildkite.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/managed-by: kustomize
  name: cachestore-viewer-role
rules:
- apiGroups:
  - buildkite.com
  resources:
  - cachestores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - buildkite.com
  resources:
  - cachestores/status
  verbs:
  - get
