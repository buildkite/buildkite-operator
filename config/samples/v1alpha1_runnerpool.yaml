# A minimal RunnerPool, together with the agent token secret it references so
# that `kubectl apply -f config/samples/v1alpha1_runnerpool.yaml` is
# self-contained. Replace the token with a real Buildkite agent token to have
# these agents actually connect.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/managed-by: kustomize
  name: buildkite-agent-token
stringData:
  token: not-a-real-agent-token
---
apiVersion: buildkite.com/v1alpha1
kind: RunnerPool
metadata:
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/managed-by: kustomize
  name: runnerpool-sample
spec:
  queue: default
  maxRunners: 20
  minIdleRunners: 3
  idleTimeoutSeconds: 10
  agentImage: buildkite/agent:3
  singleUse: true
  agentTokenSecretRef:
    name: buildkite-agent-token
    key: token
  terminationGracePeriodSeconds: 3600
  docker:
    daemonImage: docker:29.7.2-dind
    supervisorImage: docker:29.7.2-cli
    # configSecretRef:
    #   name: registry-credentials
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 10Gi
    limits:
      cpu: "2"
      memory: 4Gi
      ephemeral-storage: 20Gi
  # Privileged runners should use dedicated, tainted nodes. Uncomment these
  # fields after applying matching labels and taints to suitable nodes.
  # nodeSelector:
  #   buildkite.com/runner: "true"
  # tolerations:
  #   - key: buildkite.com/runner
  #     operator: Equal
  #     value: "true"
  #     effect: NoSchedule
