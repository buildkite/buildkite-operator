# A cache-enabled RunnerPool and its agent token Secret. Apply it together with
# v1alpha1_cachestore.yaml using `kubectl apply -k config/samples/`. Replace the
# token with a real Buildkite agent token to have these agents connect.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/managed-by: kustomize
  name: buildkite-agent-token
stringData:
  token: not-a-real-agent-token
---
apiVersion: buildkite.com/v1alpha1
kind: RunnerPool
metadata:
  labels:
    app.kubernetes.io/name: buildkite-operator
    app.kubernetes.io/managed-by: kustomize
  name: runnerpool-sample
spec:
  queue: default
  maxRunners: 20
  minIdleRunners: 3
  idleTimeoutSeconds: 10
  image: buildkite/agent:3.128.0
  agentTokenSecretRef:
    name: buildkite-agent-token
    key: token
  cacheStoreRef:
    name: build-cache
